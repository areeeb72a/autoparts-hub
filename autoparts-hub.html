async function approveBO(boid){
  const confirmed=confirm('Send this Back Order to Ordering Department?\nThey will be notified to purchase this item.');
  if(!confirmed)return;
  try{
    const {error}=await SB.from('back_orders').update({
      status:'approved',
      approved_by:CS.name,
    }).eq('id',boid);
    if(error){alert('Error: '+error.message);return;}
    alert('✅ Back Order approved and sent to Ordering Department!');
    pgBackOrders();
  }catch(e){
    alert('Error: '+e.message);
  }
}

async function fulfillBO(boid){
  await SB.from('back_orders').update({status:'fulfilled'}).eq('id',boid);

  pgBackOrders();
}

async function pgPartsBook(){
  // Check our inventory for each part
  const {data:invItems}=await SB.from('items').select('part_no,our_part_no,qty,booked_qty,cost');

  (invItems||[]).forEach(function(i){
    if(i.part_no) invMap[i.part_no.trim()]={qty:i.qty,booked:i.booked_qty||0,cost:i.cost,opn:i.our_part_no};
  });
  window._pbInvMap=invMap;
  window._pbAllMachines=MACHINES_DB;

  // Get unique categories
  const cats=[...new Set(MACHINES_DB.map(function(m){return m.category;}))];

  let html='<div class="page-hdr">';
  html+='<div><div class="page-title">📖 Parts Reference Book</div>';
  html+='<div style="font-size:12px;color:#718096;margin-top:2px">Quick lookup for machine service parts · Komatsu Fleet</div></div>';
  html+='</div>';

  // Big search box
  html+='<div style="max-width:560px;margin-bottom:20px">';
  html+='<div style="position:relative">';
  html+='<input id="pb_search" placeholder="🔍  Search machine model (e.g. WA470, D155, PC400, GD755...)  or part number" autocomplete="off"';
  html+=' style="width:100%;font-size:16px;padding:14px 50px 14px 16px;border:2.5px solid #185FA5;border-radius:12px;outline:none;box-shadow:0 2px 12px rgba(24,95,165,0.15)"';
  html+=' oninput="pbSearch(this.value)" onkeydown="pbKeyNav(event)">';
  html+='<div id="pb_dropdown" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border:2px solid #185FA5;border-top:none;border-radius:0 0 12px 12px;max-height:260px;overflow-y:auto;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,0.15)"></div>';
  html+='</div>';
  html+='<div style="font-size:12px;color:#718096;margin-top:6px">Search by machine model or serial number — partial match supported (e.g. "470" finds WA470-5)</div>';
  html+='</div>';

  html+='<div id="pb_result">';

  // Category overview cards
  html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-bottom:20px">';
  cats.forEach(function(cat){
    const machines=MACHINES_DB.filter(function(m){return m.category===cat;});
    const icon=CAT_ICONS[cat]||'🔩';

    html+='<div style="font-size:28px;margin-bottom:6px">'+icon+'</div>';
    html+='<div style="font-weight:700;font-size:14px;color:#1a2744">'+cat+'</div>';
    html+='<div style="font-size:12px;color:#718096;margin-top:3px">'+machines.length+' machine(s)</div>';
    html+='<div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:8px">';
    machines.forEach(function(m){html+='<span style="background:#f0f4f8;color:#4a5568;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600">'+m.machine+'</span>';});

function pbSearch(val){
  const dd=document.getElementById('pb_dropdown');
  if(!dd)return;
  if(!val||val.length<1){dd.style.display='none';return;}
  const q=val.toLowerCase().replace(/[-\s]/g,'');
  const matches=MACHINES_DB.filter(function(m){
    const mn=m.machine.toLowerCase().replace(/[-\s]/g,'');
    const sn=(m.serial||'').toLowerCase().replace(/[-\s]/g,'');
    const cat=m.category.toLowerCase();
    // Also search by part number
    const hasPart=m.parts.some(function(p){return p.part_no.toLowerCase().replace(/-/g,'').includes(q);});
    return mn.includes(q)||sn.includes(q)||cat.includes(q)||hasPart;
  });
  if(!matches.length){
    dd.style.display='block';
    dd.innerHTML='<div style="padding:16px;text-align:center;color:#718096">No machines found for "'+val+'"</div>';
    dd._matches=[];return;
  }
  dd.style.display='block';
  dd._matches=matches;
  dd._cursor=0;
  dd.innerHTML=matches.map(function(m,idx){
    const icon=CAT_ICONS[m.category]||'🔩';
    const partCount=m.parts.length;
    // Check stock availability
    const inStock=m.parts.filter(function(p){const inv=window._pbInvMap[p.part_no];return inv&&inv.qty>0;}).length;
    const stockColor=inStock===partCount?'#38a169':inStock>0?'#d69e2e':'#e53e3e';
    return '<div id="pb_opt_'+idx+'" onclick="pbSelectMachine('+idx+')" onmouseover="pbHover('+idx+')" style="padding:12px 16px;cursor:pointer;border-bottom:1px solid #f0f4f8;display:flex;align-items:center;gap:12px;'+(idx===0?'background:#ebf8ff;':'')+'">'
      +'<div style="font-size:22px">'+icon+'</div>'
      +'<div style="flex:1">'
      +'<div style="font-weight:700;font-size:14px;color:#1a2744">'+m.machine+'</div>'
      +'<div style="font-size:12px;color:#718096">'+m.category+' · S/N: '+m.serial+'</div>'
      +'</div>'
      +'<div style="text-align:right">'
      +'<div style="font-size:12px;color:#718096">'+partCount+' parts</div>'
      +'<div style="font-size:11px;font-weight:700;color:'+stockColor+'">'+inStock+'/'+partCount+' in stock</div>'
      +'</div>'
      +'</div>';
  }).join('');
}

function pbHover(idx){
  const dd=document.getElementById('pb_dropdown');
  if(!dd)return;
  Array.from(dd.children).forEach(function(el,i){el.style.background=i===idx?'#ebf8ff':'';});
  dd._cursor=idx;
}

function pbKeyNav(e){
  const dd=document.getElementById('pb_dropdown');
  if(!dd||dd.style.display==='none')return;
  const matches=dd._matches||[];
  let cursor=dd._cursor||0;
  if(e.key==='ArrowDown'){e.preventDefault();cursor=Math.min(cursor+1,matches.length-1);pbHover(cursor);}
  else if(e.key==='ArrowUp'){e.preventDefault();cursor=Math.max(cursor-1,0);pbHover(cursor);}
  else if(e.key==='Enter'){e.preventDefault();if(matches[cursor])pbSelectMachine(cursor);}
  else if(e.key==='Escape'){dd.style.display='none';}
  dd._cursor=cursor;
}

function pbSelectMachine(idx){
  const dd=document.getElementById('pb_dropdown');
  const m=(dd&&dd._matches)?dd._matches[idx]:null;
  if(!m)return;
  if(dd)dd.style.display='none';
  const s=document.getElementById('pb_search');
  if(s)s.value=m.machine+(m.serial&&m.serial!=='—'?' (S/N: '+m.serial+')':'');
  pbShowMachine(m);
}

function pbFilterCat(cat){
  const machines=MACHINES_DB.filter(function(m){return m.category===cat;});
  const icon=CAT_ICONS[cat]||'🔩';
  const el=document.getElementById('pb_result');
  if(!el)return;
  const s=document.getElementById('pb_search');
  if(s)s.value=cat;

  let html='<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">';
  html+='<div style="font-size:28px">'+icon+'</div>';
  html+='<div><div style="font-size:18px;font-weight:800;color:#1a2744">'+cat+'</div>';
  html+='<div style="font-size:13px;color:#718096">'+machines.length+' machine(s) in reference book</div></div>';
  html+='<button class="btn btn-sm" onclick="pgPartsBook()" style="margin-left:auto">← Back</button>';
  html+='</div>';

  html+='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">';
  machines.forEach(function(m,idx){
    const inStock=m.parts.filter(function(p){const inv=window._pbInvMap[p.part_no];return inv&&inv.qty>0;}).length;
    const stockPct=Math.round(inStock/m.parts.length*100);
    const stockColor=inStock===m.parts.length?'#38a169':inStock>0?'#d69e2e':'#e53e3e';
    html+='<div onclick="pbShowMachine(MACHINES_DB['+MACHINES_DB.indexOf(m)+'])" style="background:#fff;border:2px solid #e2e8f0;border-radius:12px;padding:16px;cursor:pointer" onmouseover="this.style.borderColor=\'#185FA5\'" onmouseout="this.style.borderColor=\'#e2e8f0\'">';
    html+='<div style="font-size:18px;font-weight:800;color:#1a2744;margin-bottom:4px">'+m.machine+'</div>';
    html+='<div style="font-size:12px;color:#718096;margin-bottom:10px">S/N: '+m.serial+'</div>';
    html+='<div style="background:#f0f4f8;border-radius:20px;height:6px;margin-bottom:6px"><div style="background:'+stockColor+';height:6px;border-radius:20px;width:'+stockPct+'%"></div></div>';
    html+='<div style="font-size:11px;color:'+stockColor+';font-weight:700">'+inStock+'/'+m.parts.length+' parts in stock</div>';
    html+='</div>';
  });
  html+='</div>';
  el.innerHTML=html;
}

    html+='<td style="padding:10px 14px;text-align:center;font-weight:700">'+p.qty+'</td>';
    html+='<td style="padding:10px 14px;text-align:center;font-size:12px;color:#553c9a;font-weight:600">'+(inv?.opn||'—')+'</td>';
    html+='<td style="padding:10px 14px;text-align:center;font-weight:700;color:'+(inv?(inv.qty>0?'#1a2744':'#e53e3e'):'#a0aec0')+'">'+(inv!=null?inv.qty:'—')+'</td>';
    html+='<td style="padding:10px 14px;text-align:center;font-weight:800;font-size:15px;color:'+(avail!=null?(avail>0?'#38a169':avail===0&&inv?.qty>0?'#d69e2e':'#e53e3e'):'#a0aec0')+'">'+(avail!=null?avail:'—')+'</td>';
    if(canSeeCost) html+='<td style="padding:10px 14px;text-align:right;font-weight:700;color:#185FA5">'+(inv?AED(SP(inv.cost)):'—')+'</td>';
    html+='<td style="padding:10px 14px;text-align:center">'+statusBadge+'</td>';
    html+='</tr>';
  });

  html+='</tbody></table></div>';

  // Add to quote button
  if(['owner','manager','salesperson'].includes(CS.role)){
    const avParts=m.parts.filter(function(p){const inv=invMap[p.part_no];return inv&&Math.max(0,inv.qty-(inv.booked||0))>0;});
    if(avParts.length>0){
      html+='<div class="alert alert-info" style="margin-top:12px;display:flex;align-items:center;justify-content:space-between">';
      html+='<span><b>'+avParts.length+' parts</b> available in stock — ready to quote</span>';
      html+='<button class="btn btn-primary btn-sm" onclick="pgQuotes()">Go to Quotes →</button>';
      html+='</div>';
    }
  }

  el.innerHTML=html;
  el.scrollIntoView({behavior:'smooth'});
}

function pbPrintMachine(machineName,serial,category){
  const m=MACHINES_DB.find(function(x){return x.machine===machineName&&x.serial===serial;});
  if(!m)return;
  const invMap=window._pbInvMap||{};
  const icon=CAT_ICONS[category]||'🔩';
  const canSeeCost=['owner','manager'].includes(CS.role);

  const rows=m.parts.map(function(p,idx){
    const inv=invMap[p.part_no];
    const avail=inv?Math.max(0,inv.qty-(inv.booked||0)):null;
    const statusText=!inv?'Not in System':avail>0?'Available ('+avail+')':inv.qty>0?'All Reserved':'Out of Stock';
    const statusColor=!inv?'#d69e2e':avail>0?'#276749':inv.qty>0?'#c05621':'#9b2c2c';
    return '<tr style="border-bottom:1px solid #e2e8f0">'
      +'<td style="padding:8px 10px;color:#718096">'+(idx+1)+'</td>'
      +'<td style="padding:8px 10px;font-weight:600">'+p.description+'</td>'
      +'<td style="padding:8px 10px;font-family:monospace;font-weight:700;color:#185FA5">'+p.part_no+'</td>'
      +'<td style="padding:8px 10px;text-align:center">'+p.qty+'</td>'
      +(canSeeCost?'<td style="padding:8px 10px;text-align:right">'+(inv?AED(SP(inv.cost)):'—')+'</td>':'')
      +'<td style="padding:8px 10px;text-align:center;font-weight:700;color:'+statusColor+'">'+statusText+'</td>'
      +'</tr>';
  }).join('');

  const pw=window.open('','_blank','width=900,height=700');
  pw.document.write('<!DOCTYPE html><html><head><title>'+machineName+' Parts List</title>'
    +'<style>body{font-family:Arial,sans-serif;font-size:13px;padding:30px;max-width:850px;margin:0 auto}'
    +'.hdr{display:flex;justify-content:space-between;margin-bottom:20px;padding-bottom:16px;border-bottom:3px solid #185FA5}'
    +'table{width:100%;border-collapse:collapse;margin-top:12px}'
    +'th{background:#1a2744;color:#fff;padding:9px 10px;text-align:left;font-size:12px}'
    +'@media print{button{display:none}}</style></head><body>'
    +'<div class="hdr">'
    +'<div><div style="font-size:22px;font-weight:800;color:#185FA5">🔧 AutoParts Hub</div>'
    +'<div style="color:#718096">Parts Reference · '+category+'</div></div>'
    +'<div style="text-align:right">'
    +'<div style="font-size:26px">'+icon+' <span style="font-size:20px;font-weight:800;color:#1a2744">'+machineName+'</span></div>'
    +'<div style="color:#718096">S/N: '+serial+' · Date: '+TD()+'</div>'
    +'</div></div>'
    +'<table><thead><tr><th>#</th><th>Description</th><th>Part Number</th><th style="text-align:center">Req Qty</th>'+(canSeeCost?'<th style="text-align:right">Selling Price</th>':'')+'<th style="text-align:center">Stock Status</th></tr></thead>'
    +'<tbody>'+rows+'</tbody></table>'
    +'<p style="margin-top:20px;font-size:11px;color:#718096">Generated from AutoParts Hub ERP · '+TD()+'</p>'
    +'<button onclick="window.print()" style="margin-top:10px;padding:10px 28px;background:#185FA5;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:700">🖨 Print / Save PDF</button>'
    +'</body></html>');
  pw.document.close();
}

// DISCREPANCIES
async function pgDisc(){
  try{
    const [{data:ds},{data:items}]=await Promise.all([
      SB.from('discrepancies').select('*').order('created_at',{ascending:false}),
      SB.from('items').select('id,name')
    ]);
    setHTML(`<div class="page-hdr"><div class="page-title">Discrepancies</div></div>
    <div class="tbl-wrap"><table><thead><tr><th>ID</th><th>PO</th><th>Item</th><th>Received</th><th>Type</th><th>Date</th><th>Status</th><th></th></tr></thead>
    <tbody>${(ds||[]).length===0?'<tr><td colspan="8" style="text-align:center;padding:30px;color:#718096">No discrepancies reported</td></tr>':(ds||[]).map(d=>{
      const it=items?.find(i=>i.id===d.item_id);
      return `<tr>
        <td><b>${d.id}</b></td><td>${d.po_id||'—'}</td>
        <td>${it?.name||d.item_id}</td>
        <td>${d.received_qty}</td>
        <td><span class="badge ${d.discrepancy_type==='short'?'badge-warning':'badge-danger'}">${d.discrepancy_type||'—'}</span></td>
        <td>${d.date}</td>
        <td><span class="badge ${d.status==='resolved'?'badge-success':'badge-warning'}">${d.status}</span></td>
        <td>${d.status==='reported'?`<button class="btn btn-sm btn-success" onclick="rslvDisc('${d.id}')">Resolve</button>`:'—'}</td>
      </tr>`;
    }).join('')}</tbody></table></div>`);
  }catch(e){
    setHTML(`<div class="alert alert-warning">Error: ${e.message}</div><button class="btn btn-primary" onclick="pgDisc()">🔄 Retry</button>`);
  }
}
async function rslvDisc(id){
  await SB.from('discrepancies').update({status:'resolved'}).eq('id',id);
  pgDisc();
}

// REPORTS
async function pgRep(){
  const [{data:items},{data:invs},{data:orders},{data:sd}]=await Promise.all([SB.from('items').select('*'),SB.from('invoices').select('*'),SB.from('orders').select('*'),SB.from('short_damaged').select('*')]);
  const sv=(items||[]).reduce((s,i)=>s+i.qty*i.cost,0),tr=(invs||[]).reduce((s,i)=>s+i.total,0);
  const cats=[...new Set((items||[]).map(i=>i.category))];
  setHTML(`<div class="page-hdr"><div class="page-title">Reports</div></div>
  <div class="grid4">
    <div class="metric"><div class="metric-label">Stock Value</div><div class="metric-value" style="font-size:16px">${AED(sv)}</div></div>
    <div class="metric"><div class="metric-label">Total Revenue</div><div class="metric-value" style="font-size:16px;color:#38a169">${AED(tr)}</div></div>
    <div class="metric"><div class="metric-label">Total Orders</div><div class="metric-value">${(orders||[]).length}</div></div>
    <div class="metric"><div class="metric-label">Short/Damaged Events</div><div class="metric-value text-danger">${(sd||[]).length}</div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="card-title">Stock by Category</div><div class="tbl-wrap"><table><thead><tr><th>Category</th><th>Items</th><th>Qty</th><th>Value</th></tr></thead><tbody>${cats.map(cat=>{const ci=(items||[]).filter(i=>i.category===cat);return `<tr><td>${cat}</td><td>${ci.length}</td><td>${ci.reduce((s,i)=>s+i.qty,0)}</td><td>${AED(ci.reduce((s,i)=>s+i.qty*i.cost,0))}</td></tr>`;}).join('')}</tbody></table></div></div>
    <div class="card"><div class="card-title">Short & Damaged</div>${(sd||[]).length===0?'<div class="empty-state" style="padding:20px">✅ No records</div>':'<div class="tbl-wrap"><table><thead><tr><th>Order</th><th>Short</th><th>Damaged</th><th>Date</th></tr></thead><tbody>'+(sd||[]).slice(0,10).map(r=>`<tr><td>${r.order_id}</td><td class="text-danger">${r.short_qty}</td><td class="text-danger">${r.damaged_qty}</td><td>${r.date}</td></tr>`).join('')+'</tbody></table></div>'}</div>
  </div>
  <div class="card"><div class="card-title">Low Stock Items</div><div class="tbl-wrap"><table><thead><tr><th>Part No</th><th>Name</th><th>Qty</th><th>Reorder</th><th>Status</th></tr></thead><tbody>${(items||[]).filter(i=>i.qty<=i.reorder_level).map(i=>`<tr><td style="font-size:12px;color:#718096">${i.part_no}</td><td>${i.name}</td><td class="${i.qty===0?'text-danger':''}">${i.qty}</td><td>${i.reorder_level}</td><td>${i.qty===0?'<span class="badge badge-danger">Out</span>':'<span class="badge badge-warning">Low</span>'}</td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;padding:20px;color:#718096">✅ All stocked</td></tr>'}</tbody></table></div></div>`);
}

// STAFF
async function pgStaff(){
  const {data:staff}=await SB.from('staff').select('*').order('name');
  setHTML(`<div class="page-hdr"><div class="page-title">Staff Management</div><button class="btn btn-primary" onclick="showAddStaff()">+ Add Staff</button></div>
  <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Phone</th><th>Status</th><th></th></tr></thead>
  <tbody>${(staff||[]).map(s=>`<tr><td><b>${s.name}</b></td><td style="font-size:12px;color:#718096">${s.email}</td><td><span class="badge badge-info">${ROLES[s.role]||s.role}</span></td><td style="font-size:12px">${s.phone||'—'}</td><td><span class="badge ${s.active?'badge-success':'badge-gray'}">${s.active?'Active':'Inactive'}</span></td><td><button class="btn btn-sm" onclick="tglStaff('${s.id}',${s.active})">${s.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div>`);
}
async function tglStaff(id,a){await SB.from('staff').update({active:!a}).eq('id',id);pgStaff();}
function showAddStaff(){
  openM(`<div class="modal" style="width:440px">
    <div class="modal-title">Add Staff Member</div>
    <div class="form-row cols2"><div class="form-group"><label>Full Name</label><input id="sf_n"></div><div class="form-group"><label>Email</label><input id="sf_e" type="email"></div></div>
    <div class="form-row cols2"><div class="form-group"><label>Role</label><select id="sf_r">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><div class="form-group"><label>Phone</label><input id="sf_p" placeholder="+971..."></div></div>
    <div class="info-box">Staff logs in with their email. They set password on first login.</div>
    <div class="modal-footer"><button class="btn" onclick="closeM()">Cancel</button><button class="btn btn-primary" onclick="saveStaff()">Add</button></div>
  </div>`);
}
async function saveStaff(){
  const e=document.getElementById('sf_e').value.trim();
  if(!e){alert('Email required');return;}
  const {error}=await SB.from('staff').insert({email:e,name:document.getElementById('sf_n').value.trim(),role:document.getElementById('sf_r').value,phone:document.getElementById('sf_p').value,active:true});
  if(error){alert(error.message);return;}
  closeM();pgStaff();
}

// SETTINGS
async function pgSettings(){
  const {data:sets}=await SB.from('settings').select('*');
  const mg=(sets||[]).find(s=>s.key==='margin')?.value||'40';
  const defTax=(sets||[]).find(s=>s.key==='default_tax_pct')?.value||'0';
  const defCur=(sets||[]).find(s=>s.key==='default_currency')?.value||'AED';
  setHTML(`<div class="page-hdr"><div class="page-title">Settings</div></div>
  <div class="card" style="max-width:480px"><div class="card-title">Pricing & Currency</div>
    <div class="form-row cols2">
      <div class="form-group"><label>Default Selling Margin (%)</label><input type="number" id="set_m" value="${mg}" min="0" max="500"></div>
      <div class="form-group"><label>Default VAT/Tax (%)</label><input type="number" id="set_tax" value="${defTax}" min="0" max="100" step="0.5" placeholder="0 = no tax"></div>
    </div>
    <div class="form-group"><label>Default Currency</label>
      <select id="set_cur">
        ${CURRENCIES.map(c=>`<option value="${c}" ${c===defCur?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>
    <div class="info-box">
      Margin: <b>${mg}%</b> · Tax: <b>${defTax}%</b> · Currency: <b>${defCur}</b><br>
      <small>These are defaults for new quotes. Can be changed per quote.</small>
    </div>
    <button class="btn btn-primary" onclick="saveSets()" style="margin-top:8px">Save Settings</button>
  </div>
  <div class="card" style="max-width:480px"><div class="card-title">System Info</div>
    <div style="font-size:13px;line-height:2.2">
      <div style="display:flex;justify-content:space-between;border-bottom:1px solid #f0f4f8"><span class="text-muted">App</span><span>AutoParts Hub ERP</span></div>
      <div style="display:flex;justify-content:space-between;border-bottom:1px solid #f0f4f8"><span class="text-muted">Default Currency</span><span>${defCur}</span></div>
      <div style="display:flex;justify-content:space-between;border-bottom:1px solid #f0f4f8"><span class="text-muted">Default Tax</span><span>${defTax}%</span></div>
      <div style="display:flex;justify-content:space-between;border-bottom:1px solid #f0f4f8"><span class="text-muted">Database</span><span>Supabase PostgreSQL</span></div>
      <div style="display:flex;justify-content:space-between"><span class="text-muted">Logged in as</span><span>${CS.name} · ${ROLES[CS.role]||CS.role}</span></div>
    </div>
  </div>`);
}
async function saveSets(){
  const m=document.getElementById('set_m').value;
  const tax=document.getElementById('set_tax').value;
  const cur=document.getElementById('set_cur').value;
  await Promise.all([
    SB.from('settings').upsert({key:'margin',value:m}),
    SB.from('settings').upsert({key:'default_tax_pct',value:tax}),
    SB.from('settings').upsert({key:'default_currency',value:cur}),
  ]);
  MGN=parseFloat(m)||40;
  alert('✅ Settings saved!\nMargin: '+m+'% | Tax: '+tax+'% | Currency: '+cur);
  pgSettings();
}
