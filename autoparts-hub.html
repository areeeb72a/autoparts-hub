<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a2744">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;background:#f0f4f8;color:#1a202c;height:100vh;overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#1a365d 0%,#2a69ac 100%)}
.login-box{background:#fff;border-radius:16px;padding:40px;width:400px;box-shadow:0 20px 60px rgba(0,0,0,0.25)}
.login-logo{font-size:28px;font-weight:800;color:#185FA5;margin-bottom:4px}
.login-sub{color:#718096;font-size:13px;margin-bottom:28px}
.login-box label{display:block;font-size:12px;font-weight:700;color:#4a5568;margin-bottom:5px;text-transform:uppercase;letter-spacing:0.5px}
.login-box input{width:100%;padding:11px 14px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:14px;margin-bottom:16px;transition:border 0.2s}
.login-box input:focus{outline:none;border-color:#185FA5}
.btn-login{width:100%;padding:13px;background:#185FA5;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.btn-login:hover{background:#0C447C}
.login-err{color:#e53e3e;font-size:13px;margin-bottom:12px;text-align:center;background:#fff5f5;padding:8px;border-radius:6px}
.login-hint{margin-top:14px;font-size:12px;color:#718096;text-align:center;background:#f7fafc;padding:10px;border-radius:8px;line-height:1.6}
.topbar{background:#1a2744;color:#fff;padding:0 20px;display:flex;align-items:center;gap:12px;height:52px;flex-shrink:0}
.topbar-logo{font-size:17px;font-weight:800;color:#63b3ed}
.topbar-logo span{font-weight:400;opacity:0.6;font-size:13px;margin-left:4px;color:#fff}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.role-pill{background:rgba(99,179,237,0.2);border:1px solid rgba(99,179,237,0.4);padding:3px 12px;border-radius:20px;font-size:12px;font-weight:700;color:#63b3ed}
.user-name{font-size:13px;opacity:0.8}
.btn-logout{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:5px 14px;border-radius:6px;cursor:pointer;font-size:12px}
.btn-logout:hover{background:rgba(255,255,255,0.2)}
.body-wrap{display:flex;flex:1;overflow:hidden}
.sidebar{width:215px;background:#1e2d4a;overflow-y:auto;flex-shrink:0;padding:10px 0}
.nav-section{padding:12px 16px 4px;font-size:10px;color:rgba(255,255,255,0.35);font-weight:700;text-transform:uppercase;letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:rgba(255,255,255,0.6);font-size:13px;border-left:3px solid transparent;transition:all 0.15s}
.nav-item:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav-item.active{background:rgba(99,179,237,0.15);color:#fff;border-left:3px solid #63b3ed}
.nav-icon{font-size:15px;width:20px;text-align:center}
.main{flex:1;overflow-y:auto;padding:22px}
.page-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.page-title{font-size:20px;font-weight:800;color:#1a202c}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:18px;margin-bottom:14px}
.card-title{font-size:11px;font-weight:700;color:#718096;margin-bottom:14px;text-transform:uppercase;letter-spacing:0.8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.metric{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px}
.metric-label{font-size:12px;color:#718096;margin-bottom:6px;font-weight:600}
.metric-value{font-size:22px;font-weight:800;color:#1a202c}
.metric-sub{font-size:11px;color:#a0aec0;margin-top:3px}
.btn{padding:8px 16px;border-radius:8px;border:1.5px solid #e2e8f0;background:#fff;cursor:pointer;font-size:13px;font-weight:600;color:#1a202c;transition:all 0.15s;font-family:inherit}
.btn:hover{background:#f7fafc}
.btn-primary{background:#185FA5;color:#fff;border-color:#185FA5}
.btn-primary:hover{background:#0C447C;border-color:#0C447C}
.btn-success{background:#c6f6d5;color:#276749;border-color:#9ae6b4}
.btn-danger{background:#fed7d7;color:#9b2c2c;border-color:#fc8181}
.btn-warning{background:#fefcbf;color:#744210;border-color:#f6e05e}
.btn-sm{padding:4px 10px;font-size:12px;border-radius:6px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:700;color:#4a5568;margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#1a202c;transition:border 0.2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:#185FA5}
.form-row{display:grid;gap:12px}
.cols2{grid-template-columns:1fr 1fr}
.cols3{grid-template-columns:1fr 1fr 1fr}
.tbl-wrap{border-radius:10px;overflow:hidden;border:1px solid #e2e8f0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 14px;background:#f8fafc;border-bottom:1px solid #e2e8f0;font-size:11px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:0.5px}
td{padding:10px 14px;border-bottom:1px solid #f0f4f8;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-success{background:#c6f6d5;color:#276749}
.badge-danger{background:#fed7d7;color:#9b2c2c}
.badge-warning{background:#fefcbf;color:#744210}
.badge-info{background:#bee3f8;color:#2c5282}
.badge-gray{background:#e2e8f0;color:#4a5568}
.toolbar{display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap}
.toolbar input,.toolbar select{max-width:200px;margin-bottom:0}
.ml{margin-left:auto}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:#fff;border-radius:14px;padding:24px;width:620px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 60px rgba(0,0,0,0.3)}
.modal-title{font-size:17px;font-weight:800;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid #e2e8f0}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;padding-top:14px;border-top:1px solid #e2e8f0}
.alert{padding:12px 16px;border-radius:8px;margin-bottom:14px;font-size:13px;font-weight:600}
.alert-warning{background:#fefcbf;color:#744210;border:1px solid #f6e05e}
.alert-danger{background:#fed7d7;color:#9b2c2c;border:1px solid #fc8181}
.alert-success{background:#c6f6d5;color:#276749;border:1px solid #9ae6b4}
.alert-info{background:#bee3f8;color:#2c5282;border:1px solid #90cdf4}
.text-danger{color:#e53e3e;font-weight:700}
.text-success{color:#38a169;font-weight:700}
.text-muted{color:#718096}
.picking-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px}
.loading{display:flex;align-items:center;justify-content:center;padding:60px;color:#718096;font-size:15px;gap:10px}
.spinner{width:22px;height:22px;border:2.5px solid #e2e8f0;border-top-color:#185FA5;border-radius:50%;animation:spin 0.8s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px 20px;color:#718096}
.order-line-item{display:flex;align-items:center;gap:8px;padding:10px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;margin-bottom:6px;flex-wrap:wrap}
.stock-warn{background:#fff5f5;border-color:#fc8181}
.info-box{background:#ebf8ff;border:1px solid #90cdf4;border-radius:8px;padding:12px;margin:10px 0;font-size:13px;color:#2c5282}
.sep{height:1px;background:#e2e8f0;margin:14px 0}
</style>
</head>
<body>
<div id="loginScreen">
  <div class="login-wrap">
    <div class="login-box">
      <div class="login-logo">🔧 AutoParts Hub</div>
      <div class="login-sub">Spare Parts Inventory Management · AED</div>
      <div id="loginErr" class="login-err" style="display:none"></div>
      <label>Email Address</label>
      <input type="email" id="loginEmail" placeholder="your@email.com" onkeydown="if(event.key==='Enter')doLogin()">
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Min 6 characters" onkeydown="if(event.key==='Enter')doLogin()">
      <button class="btn-login" onclick="doLogin()" id="loginBtn">Login to AutoParts Hub</button>
      <div class="login-hint">
        <strong>Owner:</strong> areeeb72@gmail.com<br>
        <strong>Manager:</strong> jrsy2027@gmail.com<br>
        First login: use any password (min 6 chars) to create account
      </div>
    </div>
  </div>
</div>
<div id="appScreen" class="app" style="display:none">
  <div class="topbar">
    <div class="topbar-logo">🔧 AutoParts Hub <span>ERP</span></div>
    <div class="topbar-right">
      <span class="role-pill" id="topRole"></span>
      <span class="user-name" id="topName"></span>
      <button class="btn-logout" onclick="doLogout()">Logout</button>
    </div>
  </div>
  <div class="body-wrap">
    <div class="sidebar" id="sidebar"></div>
    <div class="main" id="mainContent"><div class="loading"><div class="spinner"></div>Loading...</div></div>
  </div>
</div>
<div id="modalWrap"></div>
<script>
// Global error handler
window.addEventListener("unhandledrejection",e=>{console.error("Unhandled:",e.reason);});
const SB=supabase.createClient('https://zkkmbhjwnhvebihvccgt.supabase.co','sb_publishable_bpwsfS2SenXSSq1jWYyBLQ_D6lY9tGi');
let CS=null,MGN=40;
const AED=n=>'AED '+Number(n||0).toFixed(2);
const TD=()=>new Date().toISOString().split('T')[0];
const SP=c=>c*(1+MGN/100);
const ROLES={owner:'Owner',manager:'Manager',store_supervisor:'Store Supervisor',parts_supervisor:'Parts Supervisor',salesperson:'Salesperson',ordering:'Ordering Dept',picker:'Picker',cashier:'Cashier',driver:'Driver'};

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const btn=document.getElementById('loginBtn');
  const errEl=document.getElementById('loginErr');
  errEl.style.display='none';
  if(!email||!pass){errEl.textContent='Enter email and password';errEl.style.display='block';return;}
  btn.textContent='Logging in...';btn.disabled=true;
  try{
    let res=await SB.auth.signInWithPassword({email,password:pass});
    if(res.error){
      res=await SB.auth.signUp({email,password:pass});
      if(res.error)throw res.error;
    }
    if(!res.data?.user)throw new Error('Login failed');
    const {data:staff}=await SB.from('staff').select('*').eq('email',email).single();
    CS=staff||{email,name:email.split('@')[0],role:'salesperson',active:true};
    const {data:sets}=await SB.from('settings').select('*');
    if(sets)sets.forEach(r=>{if(r.key==='margin')MGN=parseFloat(r.value)||40;});
    showApp();
  }catch(e){
    errEl.textContent=e.message||'Login failed';errEl.style.display='block';
  }
  btn.textContent='Login to AutoParts Hub';btn.disabled=false;
}

async function doLogout(){
  await SB.auth.signOut();CS=null;
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('appScreen').style.display='none';
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='flex';
  document.getElementById('topRole').textContent=ROLES[CS.role]||'User';
  document.getElementById('topName').textContent=CS.name;
  buildNav();
  const m=getMenus();if(m.length)nav(m[0].id);
}

function getMenus(){
  const r=CS.role;
  return [
    {id:'dashboard',icon:'📊',label:'Dashboard',r:['owner','manager','store_supervisor','parts_supervisor','salesperson','ordering','picker','cashier']},
    {id:'inventory',icon:'📦',label:'Inventory',r:['owner','manager','store_supervisor','parts_supervisor','salesperson']},
    {id:'items_master',icon:'🗃️',label:'Items Master',r:['owner','manager','parts_supervisor','ordering']},
    {id:'item_inquiry',icon:'🔍',label:'Item Inquiry',r:['owner','manager','salesperson','store_supervisor','ordering','parts_supervisor','picker']},
    {id:'parts_book',icon:'📖',label:'Parts Reference Book',r:['owner','manager','salesperson','store_supervisor','ordering','parts_supervisor','picker']},
    {id:'customers',icon:'🏢',label:'Customers',r:['owner','manager','salesperson']},
    {id:'quotes',icon:'📝',label:'Quotes',r:['owner','manager','salesperson']},
    {id:'orders',icon:'🛒',label:'Orders',r:['owner','manager','salesperson','store_supervisor']},
    {id:'back_orders',icon:'📋',label:'Back Orders',r:['owner','manager','salesperson','store_supervisor','ordering']},
    {id:'picking',icon:'🔧',label:'Picking Queue',r:['picker','manager','store_supervisor','owner']},
    {id:'short_damaged',icon:'⚠️',label:'Short & Damaged',r:['store_supervisor','manager','owner']},
    {id:'delivery_notes',icon:'🚚',label:'Delivery Notes',r:['salesperson','manager','driver','owner']},
    {id:'invoices',icon:'🧾',label:'Invoices',r:['cashier','manager','owner','salesperson']},
    {id:'payments',icon:'💵',label:'Payments',r:['cashier','manager','owner']},
    {id:'suppliers',icon:'🏭',label:'Supplier Master',r:['ordering','manager','owner','parts_supervisor']},
    {id:'purchase_orders',icon:'📋',label:'Purchase Orders',r:['ordering','manager','owner','parts_supervisor']},
    {id:'claim_forms',icon:'📑',label:'Claim Forms',r:['ordering','manager','owner','store_supervisor']},
    {id:'inv_adjustments',icon:'🔄',label:'Inventory Adjustments',r:['ordering','manager','owner','parts_supervisor','store_supervisor']},
    {id:'discrepancies',icon:'🔴',label:'Discrepancies',r:['store_supervisor','ordering','manager','owner']},
    {id:'reports',icon:'📈',label:'Reports',r:['owner','manager','store_supervisor']},
    {id:'staff',icon:'👥',label:'Staff',r:['owner','manager']},
    {id:'settings',icon:'⚙️',label:'Settings',r:['owner','manager']},
  ].filter(m=>m.r.includes(r));
}

function buildNav(){
  document.getElementById('sidebar').innerHTML='<div class="nav-section">Menu</div>'+getMenus().map(m=>`<div class="nav-item" id="nav-${m.id}" onclick="nav('${m.id}')"><span class="nav-icon">${m.icon}</span>${m.label}</div>`).join('');
}

function nav(p){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const el=document.getElementById('nav-'+p);if(el)el.classList.add('active');
  document.getElementById('mainContent').innerHTML='<div class="loading"><div class="spinner"></div>Loading...</div>';
  const map={dashboard:pgDash,inventory:pgInv,items_master:pgItems,item_inquiry:pgItemInquiry,parts_book:pgPartsBook,customers:pgCust,quotes:pgQuotes,orders:pgOrders,back_orders:pgBackOrders,picking:pgPicking,short_damaged:pgSD,delivery_notes:pgDN,invoices:pgInv2,payments:pgPay,suppliers:pgSuppliers,purchase_orders:pgPO,claim_forms:pgClaimForms,inv_adjustments:pgInvAdj,discrepancies:pgDisc,reports:pgRep,staff:pgStaff,settings:pgSettings};
  const fn=map[p];
  if(!fn){setHTML('<div class="alert alert-warning">Page not found</div>');return;}
  // Timeout safety — if page doesn't load in 10s, show retry
  const timer=setTimeout(()=>{
    const mc=document.getElementById('mainContent');
    if(mc&&mc.innerHTML.includes('Loading')){
      mc.innerHTML='<div class="alert alert-warning">⚠ Page took too long to load. Check internet connection.</div><button class="btn btn-primary" onclick="nav(\''+p+'\')">🔄 Retry</button>';
    }
  },10000);
  Promise.resolve(fn()).catch(err=>{
    clearTimeout(timer);
    setHTML('<div class="alert alert-warning">⚠ Error: '+(err?.message||'Something went wrong')+'</div><button class="btn btn-primary" onclick="nav(\''+p+'\')">🔄 Retry</button>');
  }).finally(()=>clearTimeout(timer));
}

function setHTML(h){document.getElementById('mainContent').innerHTML=h;}
function closeM(){document.getElementById('modalWrap').innerHTML='';}
function openM(h){document.getElementById('modalWrap').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeM()">${h}</div>`;}
function sBadge(s){return{pending:'badge-info',picking:'badge-warning',picked:'badge-success',delivered:'badge-gray',received:'badge-success',cancelled:'badge-danger',backorder:'badge-purple'}[s]||'badge-gray';}

// DASHBOARD
async function pgDash(){
  try{
    // Role-specific minimal queries
    const role=CS.role;
    if(role==='picker'){
      const {data:orders}=await SB.from('orders').select('id,status,customer_id,date').eq('status','picking').limit(10);
      setHTML(`<div class="page-hdr"><div class="page-title">Picking Dashboard</div></div>
      <div class="metric" style="max-width:300px"><div class="metric-label">Orders Waiting to Pick</div><div class="metric-value" style="color:${(orders||[]).length?'#e53e3e':'#38a169'}">${(orders||[]).length}</div></div>
      ${(orders||[]).length?'<div class="alert alert-warning" style="margin-top:14px">📦 Go to <b>Picking Queue</b> to start picking!</div>':'<div class="alert alert-success" style="margin-top:14px">✅ No items to pick right now</div>'}`);
      return;
    }
    if(role==='cashier'){
      const {data:invs}=await SB.from('invoices').select('*').eq('status','unpaid').limit(20);
      const tot=(invs||[]).reduce((s,i)=>s+i.total,0);
      setHTML(`<div class="page-hdr"><div class="page-title">Cashier Dashboard</div></div>
      <div class="grid2" style="max-width:500px">
        <div class="metric"><div class="metric-label">Unpaid Invoices</div><div class="metric-value" style="color:#e53e3e">${(invs||[]).length}</div></div>
        <div class="metric"><div class="metric-label">Outstanding Amount</div><div class="metric-value" style="font-size:16px;color:#e53e3e">${AED(tot)}</div></div>
      </div>
      ${(invs||[]).length?'<div class="alert alert-warning" style="margin-top:14px">💵 Go to <b>Payments</b> to collect payments</div>':'<div class="alert alert-success" style="margin-top:14px">✅ All payments collected!</div>'}`);
      return;
    }
    if(role==='ordering'||role==='parts_supervisor'){
      const [{data:pos},{data:items}]=await Promise.all([
        SB.from('purchase_orders').select('id,status,supplier,date').order('created_at',{ascending:false}).limit(5),
        SB.from('items').select('id,name,qty,reorder_level').lte('qty','reorder_level' ).limit(10)
      ]);
      const ls=(items||[]).filter(i=>i.qty<=i.reorder_level);
      setHTML(`<div class="page-hdr"><div class="page-title">Ordering Dashboard</div></div>
      <div class="grid2">
        <div class="metric"><div class="metric-label">Pending POs</div><div class="metric-value">${(pos||[]).filter(p=>p.status==='pending').length}</div></div>
        <div class="metric"><div class="metric-label">Low Stock Items</div><div class="metric-value" style="color:${ls.length?'#e53e3e':'#38a169'}">${ls.length}</div></div>
      </div>
      ${ls.length?`<div class="card"><div class="card-title">Items to Reorder</div>${ls.map(i=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f4f8;font-size:13px"><span>${i.name}</span><span class="badge badge-danger">Qty: ${i.qty}</span></div>`).join('')}</div>`:''}
      <div class="card"><div class="card-title">Recent Purchase Orders</div>${(pos||[]).length?pos.map(p=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f4f8;font-size:13px"><span><b>${p.id}</b> — ${p.supplier||'—'}</span><span class="badge ${sBadge(p.status)}">${p.status}</span></div>`).join(''):'<div style="color:#718096;padding:10px">No POs yet</div>'}</div>`);
      return;
    }
    if(role==='store_supervisor'){
      const [{data:sd},{data:items}]=await Promise.all([
        SB.from('short_damaged').select('*').order('created_at',{ascending:false}).limit(5),
        SB.from('items').select('id,name,qty,reorder_level')
      ]);
      const ls=(items||[]).filter(i=>i.qty<=i.reorder_level);
      setHTML(`<div class="page-hdr"><div class="page-title">Store Supervisor Dashboard</div></div>
      <div class="grid2">
        <div class="metric"><div class="metric-label">Low Stock Items</div><div class="metric-value" style="color:${ls.length?'#e53e3e':'#38a169'}">${ls.length}</div></div>
        <div class="metric"><div class="metric-label">Recent Short/Damaged</div><div class="metric-value text-danger">${(sd||[]).length}</div></div>
      </div>
      ${ls.length?`<div class="card"><div class="card-title">Low Stock Alert</div>${ls.map(i=>`<div style="display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #f0f4f8;font-size:13px"><span>${i.name}</span><span class="badge badge-danger">Qty: ${i.qty}</span></div>`).join('')}</div>`:''}`);
      return;

async function deleteItem(id,name,qty){
  if(qty>0){
    alert('⚠ Cannot delete!\n\n"'+name+'" still has '+qty+' pcs in stock.\n\nReduce stock to 0 via Inventory Adjustment first.');
    return;
  }
  // Check active orders
  const {data:oi}=await SB.from('order_items').select('id,orders(status)').eq('item_id',id);
  const activeOrders=(oi||[]).filter(function(o){return ['pending','picking','picked'].includes(o.orders?.status);});
  if(activeOrders.length>0){
    alert('⚠ Cannot delete!\n\n"'+name+'" is in '+activeOrders.length+' active order(s).\nComplete or cancel those orders first.');
    return;
  }
  // Check pending quotes
  const {data:qi}=await SB.from('quote_items').select('id,quotes(status)').eq('item_id',id);
  const activeQuotes=(qi||[]).filter(function(q){return q.quotes?.status==='pending';});
  if(activeQuotes.length>0){
    alert('⚠ Cannot delete!\n\n"'+name+'" is in '+activeQuotes.length+' pending quote(s).\nCancel those quotes first.');
    return;
  }
  if(!confirm('Delete "'+name+'"?\n\nThis will also remove:\n• All quote history for this item\n• All order history for this item\n\nThis CANNOT be undone.'))return;

  // Cascade delete all related records first
  await SB.from('quote_items').delete().eq('item_id',id);
  await SB.from('order_items').delete().eq('item_id',id);
  await SB.from('po_items').delete().eq('item_id',id);
  await SB.from('back_orders').delete().eq('item_id',id);
  await SB.from('adjustment_items').delete().eq('item_id',id);

  // Now delete the item
  const {error}=await SB.from('items').delete().eq('id',id);
  if(error){
    alert('Error: '+error.message);return;
  }
  alert('✅ "'+name+'" deleted successfully.');
  pgInv();
}

function iqSearch(val){
  const dd=document.getElementById('iq_dropdown');
  const items=window._iqItems||[];
  if(!dd)return;
  if(!val||val.length<1){dd.style.display='none';return;}
  const q=val.toLowerCase();
  const matches=items.filter(function(i){
    return (i.part_no||'').toLowerCase().startsWith(q)
      ||(i.our_part_no||'').toLowerCase().startsWith(q)
      ||(i.name||'').toLowerCase().includes(q);
  }).slice(0,10);
  if(!matches.length){
    dd.style.display='block';
    dd.innerHTML='<div style="padding:14px;color:#718096;text-align:center">No items found</div>';
    dd._matches=[];return;
  }
  dd.style.display='block';
  dd._matches=matches;
  dd._cursor=0;
  dd.innerHTML=matches.map(function(i,idx){
    const avail=Math.max(0,(i.qty||0)-(i.booked_qty||0));
    const avColor=avail===0?'#e53e3e':avail<=(i.reorder_level||0)?'#d69e2e':'#38a169';
    return '<div id="iq_opt_'+idx+'" onclick="iqSelectItem(\''+i.id+'\')" onmouseover="iqHover('+idx+')" '
      +'style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f4f8;'+(idx===0?'background:#ebf8ff':'')+'\">'
      +'<div style="font-weight:700;font-size:14px">'+i.name+'</div>'
      +'<div style="font-size:12px;color:#718096;display:flex;gap:14px;margin-top:3px">'
      +(i.part_no?'<span>Supplier: <b>'+i.part_no+'</b></span>':'')
      +(i.our_part_no?'<span>Ours: <b style="color:#185FA5">'+i.our_part_no+'</b></span>':'')
      +'<span style="color:'+avColor+';font-weight:700">Avail: '+avail+'</span>'
      +'</div></div>';
  }).join('');
}

function iqHover(idx){
  const dd=document.getElementById('iq_dropdown');
  if(!dd)return;
  Array.from(dd.children).forEach(function(el,i){el.style.background=i===idx?'#ebf8ff':'';});
  dd._cursor=idx;
}

function iqKeyNav(e){
  const dd=document.getElementById('iq_dropdown');
  if(!dd||dd.style.display==='none')return;
  const matches=dd._matches||[];
  let cursor=dd._cursor||0;
  if(e.key==='ArrowDown'){e.preventDefault();cursor=Math.min(cursor+1,matches.length-1);iqHover(cursor);}
  else if(e.key==='ArrowUp'){e.preventDefault();cursor=Math.max(cursor-1,0);iqHover(cursor);}
  else if(e.key==='Enter'){e.preventDefault();if(matches[cursor])iqSelectItem(matches[cursor].id);}
  else if(e.key==='Escape'){dd.style.display='none';}
  dd._cursor=cursor;
}

function iqSelectItem(itemId){

  const el=document.getElementById('iq_search');
  if(el)el.value=item.name+(item.part_no?' ('+item.part_no+')':'');

  html+='</div>';

  html+='<div style="background:#f8fafc;border-radius:8px;padding:12px">';
  html+='<div style="font-weight:700;font-size:14px;margin-bottom:8px">Stock Position</div>';
  html+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0"><span style="color:#718096">Total Physical Stock</span><span style="font-weight:700;font-size:16px">'+(item.qty||0)+' pcs</span></div>';
  html+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #e2e8f0"><span style="color:#e53e3e">Reserved (Sales Orders)</span><span style="font-weight:700;color:#e53e3e">-'+(item.booked_qty||0)+' pcs</span></div>';
  html+='<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:2px solid #185FA5;margin-bottom:6px"><span style="font-weight:700">Available to Sell</span><span style="font-weight:800;font-size:18px;color:'+(avail<=item.reorder_level?'#e53e3e':'#38a169')+'">'+avail+' pcs</span></div>';
  html+='<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span style="color:#718096">Reorder Level</span><span>'+(item.reorder_level||0)+' pcs</span></div>';
  html+='<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span style="color:#185FA5">On Stock Order (PO)</span><span style="color:#185FA5;font-weight:700">+'+stockOrdQty+' pcs incoming</span></div>';
  html+='<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px"><span style="color:#553c9a">On Customer Order (PO)</span><span style="color:#553c9a;font-weight:700">+'+custOrdQty+' pcs incoming</span></div>';
  html+='</div></div>';

  // ── QUOTE HISTORY — Last 15 Days ──
  html+='<div style="margin-top:4px;border:2px solid #185FA5;border-radius:10px;overflow:hidden">';
  html+='<div style="background:#185FA5;color:#fff;padding:10px 14px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center">';
  html+='<span>📋 QUOTE HISTORY — Last 15 Days</span>';
  html+='<span style="font-size:12px;font-weight:400;opacity:0.85">'+recentQuotes.length+' quote(s) found</span>';
  html+='</div>';

  if(!recentQuotes.length){
    html+='<div style="padding:18px;text-align:center;color:#718096;font-size:13px">No quotes for this item in last 15 days</div>';
  } else {
    // Group by customer to spot conflicts
    const byCustomer={};
    recentQuotes.forEach(function(q){
      const custId=q.quotes?.customer_id||'unknown';
      if(!byCustomer[custId])byCustomer[custId]={name:q.customers?.name||'—',quotes:[]};
      byCustomer[custId].quotes.push(q);
    });
    const customerIds=Object.keys(byCustomer);

    // Check for price conflicts — same customer, different prices
    const allPrices=recentQuotes.map(function(q){return q.price;});
    const minP=Math.min.apply(null,allPrices);
    const maxP=Math.max.apply(null,allPrices);
    const hasConflict=maxP-minP>0.01;

    if(hasConflict){
      html+='<div style="background:#fff5f5;border-bottom:1px solid #fc8181;padding:10px 14px;font-size:12px;font-weight:700;color:#e53e3e">';
      html+='⚠️ PRICE CONFLICT DETECTED — This item was quoted at different prices! Min: '+AED(minP)+' · Max: '+AED(maxP);
      html+='</div>';
    }

    html+='<div style="max-height:220px;overflow-y:auto">';
    html+='<table style="width:100%;border-collapse:collapse;font-size:12px">';
    html+='<thead><tr style="background:#f0f4f8">';
    html+='<th style="padding:8px 12px;text-align:left;font-weight:700;color:#4a5568">Date</th>';
    html+='<th style="padding:8px 12px;text-align:left;font-weight:700;color:#4a5568">Quote ID</th>';
    html+='<th style="padding:8px 12px;text-align:left;font-weight:700;color:#4a5568">Customer</th>';
    html+='<th style="padding:8px 12px;text-align:center;font-weight:700;color:#4a5568">Qty</th>';
    html+='<th style="padding:8px 12px;text-align:right;font-weight:700;color:#4a5568">Unit Price</th>';
    if(canSeeCost) html+='<th style="padding:8px 12px;text-align:right;font-weight:700;color:#4a5568">Disc%</th>';
    html+='<th style="padding:8px 12px;text-align:center;font-weight:700;color:#4a5568">Status</th>';
    html+='</tr></thead><tbody>';

    // Sort by date desc, highlight conflicts
    recentQuotes.forEach(function(q,idx){
      const isConflictPrice=hasConflict&&(q.price===minP||q.price===maxP);
      const rowBg=idx%2===0?'#fff':'#f8fafc';
      const ld=q.discount_pct||0;
      const netPrice=q.price*(1-ld/100);
      const qStatus=q.quotes?.status||'—';
      const custName=(allCusts||[]).find(function(c){return c.id===q.quotes?.customer_id;})?.name||'—';
      html+='<tr style="background:'+(isConflictPrice&&hasConflict?'#fff5f5':rowBg)+';border-bottom:1px solid #e2e8f0">';
      html+='<td style="padding:8px 12px;color:#718096">'+(q.quotes?.date||'—')+'</td>';
      html+='<td style="padding:8px 12px;font-weight:700;color:#185FA5">'+(q.quotes?.id||'—')+'</td>';
      html+='<td style="padding:8px 12px;font-weight:600">'+custName+'</td>';
      html+='<td style="padding:8px 12px;text-align:center;font-weight:700">'+q.qty+'</td>';
      html+='<td style="padding:8px 12px;text-align:right">';
      if(ld>0){
        html+='<span style="text-decoration:line-through;color:#718096;font-size:11px">'+AED(q.price)+'</span><br>';
        html+='<b style="color:#185FA5">'+AED(netPrice)+'</b> <span style="color:#d69e2e;font-size:10px">(-'+ld+'%)</span>';
      } else {
        html+='<b style="color:'+(isConflictPrice&&hasConflict?'#e53e3e':'#185FA5')+'">'+AED(q.price)+'</b>';
      }
      html+='</td>';
      if(canSeeCost) html+='<td style="padding:8px 12px;text-align:right">'+(ld>0?ld+'%':'—')+'</td>';
      html+='<td style="padding:8px 12px;text-align:center"><span class="badge '+(qStatus==='pending'?'badge-warning':qStatus==='converted'?'badge-success':qStatus==='cancelled'?'badge-gray':'badge-info')+'">'+qStatus+'</span></td>';
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';

  // Active orders for this item
  if(activeOrds.length){
    html+='<div style="margin-top:12px"><div style="font-weight:700;font-size:13px;margin-bottom:6px;color:#4a5568">ACTIVE SALES ORDERS</div>';
    html+='<div class="tbl-wrap"><table><thead><tr><th>Order</th><th>Customer</th><th>Qty</th><th>Status</th></tr></thead><tbody>';
    activeOrds.forEach(function(o){
      html+='<tr><td style="font-size:12px"><b>'+(o.orders?.id||'—')+'</b></td>';
      html+='<td style="font-size:12px">'+(o.customers?.name||'—')+'</td>';
      html+='<td><b>'+o.qty+'</b></td>';
      html+='<td><span class="badge '+sBadge(o.orders?.status||'pending')+'">'+(o.orders?.status||'—')+'</span></td></tr>';
    });
    html+='</tbody></table></div></div>';
  }

  html+='<div class="modal-footer">';
  html+='<button class="btn" onclick="closeM()">Close</button>';
  html+='<button class="btn btn-primary" onclick="closeM();showItemMovement(\''+itemId+'\')">📊 Movement History</button>';
  html+='</div></div>';
  openM(html);
}

async function showItemMovement(itemId){
  const canSeeCost=['owner','manager'].includes(CS.role);
  const [{data:item},{data:ois},{data:pois}]=await Promise.all([
    SB.from('items').select('*').eq('id',itemId).single(),
    SB.from('order_items').select('*,orders(id,status,date,customer_id),customers(name)').eq('item_id',itemId).order('created_at',{ascending:false}).limit(100),
    SB.from('po_items').select('*,purchase_orders(id,status,date,supplier,po_type)').eq('item_id',itemId).order('created_at',{ascending:false}).limit(50)
  ]);

  // Build unified movement list
  const movements=[];

  // IN movements — PO receipts
  (pois||[]).forEach(function(p){
    if(p.purchase_orders?.status==='received'){
      movements.push({
        date:p.purchase_orders?.date||'',
        type:'IN',
        ref:p.purchase_orders?.id||'',
        party:p.purchase_orders?.supplier||'—',
        qty:p.qty,
        price:canSeeCost?p.cost:null,
        amount:canSeeCost?p.qty*p.cost:null,
        tag:p.purchase_orders?.po_type==='customer_order'?'Customer PO':'Stock PO',
        tagColor:p.purchase_orders?.po_type==='customer_order'?'badge-purple':'badge-success'
      });
    }
  });

  // OUT movements — delivered orders
  (ois||[]).forEach(function(o){
    if(['picked','delivered'].includes(o.orders?.status)){
      movements.push({
        date:o.orders?.date||'',
        type:'OUT',
        ref:o.orders?.id||'',
        party:o.customers?.name||'—',
        qty:o.picked||o.qty,
        price:canSeeCost?o.price:null,
        amount:canSeeCost?(o.picked||o.qty)*o.price:null,
        tag:'Sales',
        tagColor:'badge-info'
      });
    }
  });

  // Sort by date descending
  movements.sort(function(a,b){return b.date.localeCompare(a.date);});

  let html='<div class="modal">';
  html+='<div class="modal-title">📊 Movement History — '+item?.name+'</div>';
  html+='<div style="font-size:12px;color:#718096;margin-bottom:12px">Last 12 months · All IN and OUT movements</div>';

  // Summary cards
  const totalIn=movements.filter(function(m){return m.type==='IN';}).reduce(function(s,m){return s+m.qty;},0);
  const totalOut=movements.filter(function(m){return m.type==='OUT';}).reduce(function(s,m){return s+m.qty;},0);
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">';
  html+='<div class="metric"><div class="metric-label">Total IN</div><div class="metric-value text-success">+'+totalIn+'</div></div>';
  html+='<div class="metric"><div class="metric-label">Total OUT</div><div class="metric-value text-danger">-'+totalOut+'</div></div>';
  html+='<div class="metric"><div class="metric-label">Net Movement</div><div class="metric-value">'+(totalIn-totalOut)+'</div></div>';
  html+='<div class="metric"><div class="metric-label">Current Stock</div><div class="metric-value" style="color:#185FA5">'+(item?.qty||0)+'</div></div>';
  html+='</div>';

  if(!movements.length){
    html+='<div class="empty-state"><div style="font-size:32px">📭</div><p>No movement history found</p></div>';
  } else {
    html+='<div class="tbl-wrap"><table><thead><tr>';
    html+='<th>Date</th><th>Type</th><th>Reference</th><th>Party</th><th>Category</th><th>Qty</th>';
    if(canSeeCost) html+='<th>Unit Price</th><th>Amount</th>';
    html+='</tr></thead><tbody>';

    movements.forEach(function(m){
      const isIn=m.type==='IN';
      html+='<tr style="'+(isIn?'background:#f0fff4':'background:#fff5f5')+'">';
      html+='<td style="font-size:12px">'+m.date+'</td>';
      html+='<td><span class="badge '+(isIn?'badge-success':'badge-danger')+'">'+m.type+'</span></td>';
      html+='<td style="font-size:12px;font-weight:700">'+m.ref+'</td>';
      html+='<td style="font-size:12px">'+m.party+'</td>';
      html+='<td><span class="badge '+m.tagColor+'">'+m.tag+'</span></td>';
      html+='<td><b style="color:'+(isIn?'#38a169':'#e53e3e')+'">'+(isIn?'+':'-')+m.qty+'</b></td>';
      if(canSeeCost){
        html+='<td style="font-size:12px">'+(m.price!=null?AED(m.price):'—')+'</td>';
        html+='<td style="font-size:12px;font-weight:700">'+(m.amount!=null?AED(m.amount):'—')+'</td>';
      }
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  }

  html+='<div class="modal-footer">';
  html+='<button class="btn" onclick="showItemInquiry(\''+itemId+'\')">← Back to Inquiry</button>';
  html+='<button class="btn" onclick="closeM()">Close</button>';
  html+='</div></div>';
  openM(html);
}

function applyQuoteDisc(qid,subtotal){
  const maxDisc=DISC_LIMIT[CS.role]||0;
  openM(`<div class="modal" style="width:420px">
    <div class="modal-title">Apply Discount — Quote ${qid}</div>
    <div class="info-box">Your role (${ROLES[CS.role]}) allows max <b>${maxDisc}%</b> discount</div>
    <div class="form-row cols2">
      <div class="form-group"><label>Discount Type</label><select id="dsc_type" onchange="toggleDiscType()"><option value="quote">Full Quote Discount</option><option value="line">Line by Line</option></select></div>
      <div class="form-group" id="dsc_pct_grp"><label>Discount % (max ${maxDisc}%)</label><input id="dsc_pct" type="number" min="0" max="${maxDisc}" value="0" step="0.5"></div>
    </div>
    <div id="dsc_line_section" style="display:none">
      <div class="alert alert-info">Line discount applied per item (max ${maxDisc}% each)</div>
    </div>
    <div id="dsc_preview" style="font-size:13px;color:#718096;margin-top:8px"></div>
    <div class="modal-footer"><button class="btn" onclick="closeM()">Cancel</button><button class="btn btn-primary" onclick="saveQuoteDisc('${qid}',${subtotal})">Apply</button></div>
  </div>`);
  document.getElementById('dsc_pct').addEventListener('input',function(){
    const d=Math.min(parseFloat(this.value)||0,maxDisc);
    this.value=d;
    const save=subtotal*d/100;
    document.getElementById('dsc_preview').innerHTML=`Saving: ${AED(save)} → Final Total: <b>${AED(subtotal-save)}</b>`;
  });
}
function toggleDiscType(){
  const t=document.getElementById('dsc_type').value;
  document.getElementById('dsc_pct_grp').style.display=t==='quote'?'block':'none';

async function doPrintQuote(qid,mode){

  const quoteDisc=q.discount_pct||0;
  const taxPct=q.tax_pct||0;
  const modeLabel={none:'',supplier:'Part No',ours:'Our Part No'}[mode];

  // Calculate totals
  const subtotal=(qi||[]).reduce((s,i)=>s+i.qty*i.price*(1-(i.discount_pct||0)/100),0);
  const discAmt=subtotal*quoteDisc/100;
  const netAfterDisc=subtotal-discAmt;
  const taxAmt=netAfterDisc*taxPct/100;
  const grandTotal=netAfterDisc+taxAmt;

  const rows=(qi||[]).map(function(i){
    const itm=items?.find(function(x){return x.id===i.item_id;});

    const cooTag=i.coo?'<br><span style="font-size:10px;color:#718096;font-weight:600;letter-spacing:0.5px">COO: '+i.coo+'</span>':'';
    return '<tr>'
      +'<td style="text-align:center">'+i.qty+'</td>'
      +partCol
      +'<td>'+(itm?.name||i.item_id)+cooTag+'</td>'
      +'<td style="text-align:right">'+FMT(i.price)+'</td>'
      +'<td style="text-align:center">'+(ld>0?ld+'%':'—')+'</td>'
      +'<td style="text-align:right;font-weight:700">'+FMT(lt)+'</td>'
      +'</tr>';

  const partHeader=mode==='none'?'':`<th>${modeLabel}</th>`;

const CURRENCIES=['AED','USD','EUR','GBP','PKR','SAR','QAR','KWD','OMR','BHD'];
function FMTC(n,cur){
  const sym={AED:'AED',USD:'USD $',EUR:'€',GBP:'£',PKR:'PKR',SAR:'SAR',QAR:'QAR',KWD:'KWD',OMR:'OMR',BHD:'BHD'}[cur||'AED']||cur||'AED';
  return sym+' '+Number(n||0).toFixed(2);
}

  // Store full item data for search
  window._qItemsList=(items||[]).map(i=>({id:i.id,n:i.name,a:Math.max(0,i.qty-(i.booked_qty||0)),p:SP(i.cost),pn:i.part_no||'',opn:i.our_part_no||''}));
  window._qPriceMap=Object.fromEntries((items||[]).map(i=>[i.id,SP(i.cost)]));
  window._qSelectedItem=null;

  const defTax=parseFloat((sets||[]).find(s=>s.key==='default_tax_pct')?.value||'0');
  const defCur=(sets||[]).find(s=>s.key==='default_currency')?.value||'AED';

// Type-ahead search for quote items
function qItemSearch(val){
  const dd=document.getElementById('nq_dropdown');
  if(!dd)return;
  if(!val||val.length<1){dd.style.display='none';return;}
  const q=val.toLowerCase();
  const matches=(window._qItemsList||[]).filter(function(i){
    return i.pn.toLowerCase().startsWith(q)||i.opn.toLowerCase().startsWith(q)||i.n.toLowerCase().includes(q);
  }).slice(0,12);
  if(!matches.length){dd.style.display='none';return;}
  dd.style.display='block';
  dd.innerHTML=matches.map(function(i,idx){
    const avColor=i.a===0?'#e53e3e':i.a<=5?'#d69e2e':'#38a169';
    return '<div id="nq_opt_'+idx+'" onclick="qSelectItem(\''+i.id+'\')" onmouseover="qHover('+idx+')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f4f8;'+(idx===0?'background:#ebf8ff;':'')+'">'
      +'<div style="font-weight:700;font-size:13px">'+i.n+'</div>'
      +'<div style="font-size:11px;color:#718096;display:flex;gap:12px;margin-top:2px">'
      +(i.pn?'<span>Supplier: <b>'+i.pn+'</b></span>':'')
      +(i.opn?'<span>Ours: <b style="color:#185FA5">'+i.opn+'</b></span>':'')
      +'<span style="color:'+avColor+'"><b>Avail: '+i.a+'</b></span>'
      +'<span>Price: <b>'+AED(i.p)+'</b></span>'
      +'</div></div>';
  }).join('');
  dd._matches=matches;
  dd._cursor=0;
}

function qHover(idx){
  const dd=document.getElementById('nq_dropdown');
  if(!dd)return;
  Array.from(dd.children).forEach(function(el,i){el.style.background=i===idx?'#ebf8ff':'';});
  dd._cursor=idx;
}

function qItemKeyNav(e){
  const dd=document.getElementById('nq_dropdown');
  if(!dd||dd.style.display==='none')return;
  const matches=dd._matches||[];
  let cursor=dd._cursor||0;
  if(e.key==='ArrowDown'){e.preventDefault();cursor=Math.min(cursor+1,matches.length-1);qHover(cursor);}
  else if(e.key==='ArrowUp'){e.preventDefault();cursor=Math.max(cursor-1,0);qHover(cursor);}
  else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();if(matches[cursor])qSelectItem(matches[cursor].id);}
  else if(e.key==='Escape'){dd.style.display='none';}
  dd._cursor=cursor;
}

function qSelectItem(id){
  const item=window._qItemsList.find(function(x){return x.id===id;});
  if(!item)return;
  window._qSelectedItem=item;
  const searchEl=document.getElementById('nq_search');
  const priceEl=document.getElementById('nq_p');
  const infoEl=document.getElementById('nq_selected_item');
  const dd=document.getElementById('nq_dropdown');
  if(searchEl) searchEl.value=item.n+(item.pn?' ('+item.pn+')':'');
  if(priceEl) priceEl.value=item.p.toFixed(2);
  if(dd) dd.style.display='none';
  const avColor=item.a===0?'#e53e3e':item.a<=5?'#d69e2e':'#38a169';
  if(infoEl) infoEl.innerHTML='<b style="color:'+avColor+'">Available: '+item.a+' pcs</b>'+(item.opn?' · Our Part: <b style="color:#185FA5">'+item.opn+'</b>':'')+(item.pn?' · Supplier Part: '+item.pn:'');
  // Focus qty
  setTimeout(function(){const q=document.getElementById('nq_q');if(q)q.focus();},50);
}

function updateQPrice(){
  const id=document.getElementById('nq_i')?.value;
  if(!id)return;
  const p=window._qPriceMap[id]||0;
  const el=document.getElementById('nq_p');
  if(el)el.value=p.toFixed(2);
}

function getCurFromModal(){
  return document.getElementById('nq_currency')?.value||'AED';
}
function getTaxFromModal(){
  return parseFloat(document.getElementById('nq_tax')?.value||'0')||0;
}

function addQL(){
  const item=window._qSelectedItem;
  if(!item){
    // Check if something typed but not selected
    const searchVal=document.getElementById('nq_search')?.value?.trim();
    if(!searchVal){alert('Search and select an item first');return;}
    alert('Please select an item from the dropdown list');
    return;
  }
  const q=parseInt(document.getElementById('nq_q')?.value)||1;
  const p=parseFloat(document.getElementById('nq_p')?.value)||0;
  const eta=document.getElementById('nq_eta')?.value||'';
  const coo=document.getElementById('nq_coo')?.value||'';
  const ldisc=Math.min(parseFloat(document.getElementById('nq_ldisc')?.value)||0,DISC_LIMIT[CS.role]||0);
  qLns.push({item_id:item.id,name:item.n,qty:q,price:p,avail:item.a,eta,coo,discount_pct:ldisc});
  // Reset search
  window._qSelectedItem=null;
  const searchEl=document.getElementById('nq_search');
  const infoEl=document.getElementById('nq_selected_item');
  const priceEl=document.getElementById('nq_p');
  if(searchEl){searchEl.value='';searchEl.focus();}
  if(infoEl) infoEl.innerHTML='';
  if(priceEl) priceEl.value='0';
  document.getElementById('nq_q').value='1';
  document.getElementById('nq_ldisc').value='0';
  document.getElementById('nq_eta').value='';
  const cooEl=document.getElementById('nq_coo');if(cooEl)cooEl.value='';
  renderQLns();
}

function removeQL(i){qLns.splice(i,1);renderQLns();}

function updateQLnsDisplay(){renderQLns();}

function renderQLns(){
  const el=document.getElementById('nq_ls');
  if(!el)return;
  if(!qLns.length){el.innerHTML='';return;}
  const cur=getCurFromModal();
  const taxPct=getTaxFromModal();
  const FMT=n=>FMTC(n,cur);

  const subtotal=qLns.reduce((s,l)=>s+l.qty*l.price*(1-(l.discount_pct||0)/100),0);
  const taxAmt=subtotal*taxPct/100;
  const grandTotal=subtotal+taxAmt;

  el.innerHTML='<div style="margin-bottom:8px;font-size:12px;font-weight:700;color:#4a5568">ITEMS ('+qLns.length+')</div>'
    +qLns.map((l,i)=>{
      const lineTotal=l.qty*l.price*(1-(l.discount_pct||0)/100);
      return '<div class="order-line-item '+(l.avail<l.qty?'stock-warn':'')+'">'
      +'<span style="flex:1;font-size:13px"><b>'+l.name+'</b>'
      +(l.coo?'<span class="badge" style="margin-left:6px;background:#e9d8fd;color:#553c9a;font-size:10px">'+l.coo+'</span>':'')
      +(l.avail<l.qty&&l.eta?'<br><span style="font-size:11px;color:#d69e2e">ETA: '+l.eta+'</span>':'')
      +(l.avail<l.qty&&!l.eta?'<br><span style="font-size:11px;color:#e53e3e">No ETA</span>':'')
      +'</span>'
      +'<span style="color:#718096;font-size:12px">Avail:'+l.avail+'</span>'
      +'<span>×'+l.qty+'</span>'
      +'<span>'+FMT(l.price)+'</span>'
      +(l.discount_pct>0?'<span class="badge badge-warning">'+l.discount_pct+'% off</span>':'')
      +'<span style="font-weight:700;color:#185FA5">'+FMT(lineTotal)+'</span>'
      +(l.avail<l.qty?'<span class="badge badge-danger">Short:'+(l.qty-l.avail)+'</span>':'')
      +'<button class="btn btn-sm btn-danger" onclick="removeQL('+i+')">✕</button>'
      +'</div>';
    }).join('')
    +'<div style="text-align:right;margin-top:10px;padding:10px;background:#f8fafc;border-radius:8px">'
    +'<div style="font-size:13px;color:#718096">Subtotal: '+FMT(subtotal)+'</div>'
    +(taxPct>0?'<div style="font-size:13px;color:#d69e2e">VAT/Tax ('+taxPct+'%): +'+FMT(taxAmt)+'</div>':'')
    +'<div style="font-size:16px;font-weight:800;color:#185FA5;margin-top:4px">Grand Total: '+FMT(grandTotal)+'</div>'
    +'</div>';
}

async function saveQ(){
  if(!qLns.length){alert('Add items');return;}
  const id='QT'+Date.now().toString(36).toUpperCase().slice(-6);
  const currency=document.getElementById('nq_currency')?.value||'AED';
  const taxPct=parseFloat(document.getElementById('nq_tax')?.value||'0')||0;
  const {error}=await SB.from('quotes').insert({
    id,
    customer_id:document.getElementById('nq_c').value,
    date:document.getElementById('nq_d').value,
    status:'pending',
    notes:document.getElementById('nq_notes')?.value||'',
    currency,
    tax_pct:taxPct
  });
  if(error){alert(error.message);return;}
  await SB.from('quote_items').insert(qLns.map(function(l){return {
    quote_id:id,item_id:l.item_id,qty:l.qty,price:l.price,
    eta:l.eta||null,discount_pct:l.discount_pct||0,coo:l.coo||null
  };}));
  closeM();pgQuotes();
}
async function cancelQ(id){
  const {data:q}=await SB.from('quotes').select('status').eq('id',id).single();
  if(q?.status==='converted'){
    alert('⚠ Cannot cancel!\n\nThis quote has already been converted to an order.\nCancel the Sales Order instead from the Orders page.');
    return;
  }
  if(!confirm('Cancel Quote '+id+'? This cannot be undone.'))return;
  await SB.from('quotes').update({status:'cancelled'}).eq('id',id);
  pgQuotes();
}

async function deleteQLine(lineId,qid){
  if(!confirm('Delete this item from quote?'))return;
  await SB.from('quote_items').delete().eq('id',lineId);
  // Check if quote has any items left
  const {data:remaining}=await SB.from('quote_items').select('id').eq('quote_id',qid);
  if(!remaining||!remaining.length){
    await SB.from('quotes').update({status:'cancelled'}).eq('id',qid);
    alert('No items left — quote cancelled.');
  }
  pgQuotes();
}

async function cvtOrder(qid){
  const [{data:q},{data:qi}]=await Promise.all([
    SB.from('quotes').select('*').eq('id',qid).single(),
    SB.from('quote_items').select('*').eq('quote_id',qid)
  ]);
  const {data:cust}=await SB.from('customers').select('*').eq('id',q.customer_id).single();
  if(cust?.type==='Credit'&&cust.balance>=cust.credit_limit){
    alert('⚠ Credit limit exceeded!\nBalance: '+AED(cust.balance)+' / Limit: '+AED(cust.credit_limit));return;
  }

  // ── Stock check per item ──
  let stockSummary='';
  let canProceed=true;
  const itemStocks={};
  for(const i of (qi||[])){
    const {data:itm}=await SB.from('items').select('qty,booked_qty,name').eq('id',i.item_id).single();
    const avail=Math.max(0,(itm?.qty||0)-(itm?.booked_qty||0));
    itemStocks[i.item_id]={avail,name:itm?.name||i.item_id,ordered:i.qty};
    if(avail<i.qty){
      stockSummary+=`\n• ${itm?.name}: Need ${i.qty}, Available ${avail} (Short: ${i.qty-avail})`;
    }
  }

  if(stockSummary){
    const proceed=confirm(`⚠ STOCK SHORTAGE DETECTED:${stockSummary}\n\nDo you want to proceed?\n✅ Available qty → Goes to ORDER\n📋 Short qty → Goes to BACK ORDER\n\nClick OK to proceed, Cancel to stop.`);
    if(!proceed)return;
  }

  const oid='ORD'+Date.now().toString(36).toUpperCase().slice(-6);

  // Calculate total based on available qty only
  let orderTotal=0;
  const orderItems=[];
  const backOrderItems=[];

  for(const i of (qi||[])){
    const stock=itemStocks[i.item_id];
    const availQty=Math.min(i.qty,stock.avail);
    const backQty=i.qty-availQty;
    const disc=i.discount_pct||0;
    const unitPrice=i.price*(1-disc/100);

    if(availQty>0){
      orderItems.push({order_id:oid,item_id:i.item_id,qty:availQty,price:unitPrice,status:'pending',picked:0,eta:i.eta||null});
      orderTotal+=availQty*unitPrice;
    }
    if(backQty>0){
      backOrderItems.push({item_id:i.item_id,original_qty:i.qty,fulfilled_qty:availQty,pending_qty:backQty,eta:i.eta||null,status:'pending'});
    }
  }

  if(orderItems.length===0){
    alert('❌ No stock available for any item! Cannot create order.\nAll items will be Back Orders — please restock first or set ETA in quote.');
    // Still create back orders
    const boId='ORD'+Date.now().toString(36).toUpperCase().slice(-6);
    await SB.from('orders').insert({id:boId,customer_id:q.customer_id,quote_id:qid,date:TD(),status:'backorder',total:0});
    for(const bo of backOrderItems){
      await SB.from('back_orders').insert({id:'BO'+Date.now().toString(36).toUpperCase().slice(-6),order_id:boId,...bo});
    }
    await SB.from('quotes').update({status:'converted'}).eq('id',qid);
    alert('📋 Back Order created for all items.');
    pgQuotes();return;
  }

  // Create order
  const {error}=await SB.from('orders').insert({
    id:oid,
    customer_id:q.customer_id,
    quote_id:qid,
    date:TD(),
    status:'pending',
    total:orderTotal,
    order_type:q.order_type||'SO',
    notes:q.notes||''
  });
  if(error){alert(error.message);return;}

  // Insert order items
  await SB.from('order_items').insert(orderItems);

  // Book qty for order items
  for(const oi of orderItems){
    const {data:itm}=await SB.from('items').select('booked_qty').eq('id',oi.item_id).single();
    await SB.from('items').update({booked_qty:(itm?.booked_qty||0)+oi.qty}).eq('id',oi.item_id);
  }

  // Create back orders for short items
  for(const bo of backOrderItems){
    const boId='BO-'+Date.now().toString(36).toUpperCase().slice(-6)+Math.random().toString(36).slice(-2).toUpperCase();
    await SB.from('back_orders').insert({
      id:boId,
      order_id:oid,
      item_id:bo.item_id,
      original_qty:bo.original_qty,
      fulfilled_qty:bo.fulfilled_qty,
      pending_qty:bo.pending_qty,
      eta:bo.eta||null,
      order_type:q.order_type||'SO',
      notes:q.notes||'',
      status:'pending'
    });
  }

  await SB.from('quotes').update({status:'converted'}).eq('id',qid);

  let msg=`✅ Order ${oid} created!\nOrder Total: ${AED(orderTotal)}`;
  if(backOrderItems.length>0){
    msg+=`\n\n📋 ${backOrderItems.length} item(s) on BACK ORDER:`;
    backOrderItems.forEach(bo=>{msg+=`\n• ${itemStocks[bo.item_id]?.name}: ${bo.pending_qty} pcs pending`;});
    msg+='\n\nBack Orders visible in Orders page.';
  }
  alert(msg);
  pgQuotes();
}

async function cancelOrder(oid){
  // Check if DN exists for this order
  const {data:dns}=await SB.from('delivery_notes').select('id,status').eq('order_id',oid);
  const activeDN=(dns||[]).filter(function(d){return d.status!=='cancelled';});
  if(activeDN.length>0){
    alert('⚠ Cannot cancel order!\n\nDelivery Note '+activeDN[0].id+' exists for this order.\nPlease cancel the Delivery Note first from the Delivery Notes page.');
    return;
  }
  // Check if invoice exists
  const {data:inv}=await SB.from('invoices').select('id').eq('order_id',oid);
  if((inv||[]).length>0){
    alert('⚠ Cannot cancel order!\n\nInvoice already exists for this order. Cannot cancel an invoiced order.');
    return;
  }
  if(!confirm('Cancel Order '+oid+'?\n\nThis will:\n• Cancel the order\n• Release reserved stock\n\nThis cannot be undone.'))return;

  // Get order items to release booked qty
  const {data:oi}=await SB.from('order_items').select('*').eq('order_id',oid);
  for(const item of (oi||[])){
    const {data:itm}=await SB.from('items').select('booked_qty').eq('id',item.item_id).single();
    if(itm){
      await SB.from('items').update({booked_qty:Math.max(0,(itm.booked_qty||0)-item.qty)}).eq('id',item.item_id);
    }
  }
  await SB.from('orders').update({status:'cancelled'}).eq('id',oid);

  // Also cancel any back orders linked to this order
  await SB.from('back_orders').update({status:'cancelled'}).eq('order_id',oid).eq('status','pending');

  alert('✅ Order '+oid+' cancelled. Stock released.');
  pgOrders();
}

function ordItemSearch(val){
  const dd=document.getElementById('no_dropdown');
  if(!dd)return;
  if(!val||val.length<1){dd.style.display='none';return;}
  const q=val.toLowerCase();
  const matches=(window._ordItemsList||[]).filter(function(i){
    return i.pn.toLowerCase().startsWith(q)||i.opn.toLowerCase().startsWith(q)||i.n.toLowerCase().includes(q);
  }).slice(0,12);
  if(!matches.length){dd.style.display='none';return;}
  dd.style.display='block';
  dd._matches=matches;
  dd._cursor=0;
  dd.innerHTML=matches.map(function(i,idx){
    const avColor=i.a===0?'#e53e3e':i.a<=5?'#d69e2e':'#38a169';
    return '<div id="no_opt_'+idx+'" onclick="ordSelectItem(\''+i.id+'\')" onmouseover="ordHover('+idx+')" style="padding:10px 14px;cursor:pointer;border-bottom:1px solid #f0f4f8;'+(idx===0?'background:#ebf8ff;':'')+'">'
      +'<div style="font-weight:700;font-size:13px">'+i.n+'</div>'
      +'<div style="font-size:11px;color:#718096;display:flex;gap:12px;margin-top:2px">'
      +(i.pn?'<span>Supplier: <b>'+i.pn+'</b></span>':'')
      +(i.opn?'<span>Ours: <b style="color:#185FA5">'+i.opn+'</b></span>':'')
      +'<span style="color:'+avColor+'"><b>Avail: '+i.a+'</b></span>'
      +'<span>'+AED(i.p)+'</span>'
      +'</div></div>';
  }).join('');
}

function ordHover(idx){
  const dd=document.getElementById('no_dropdown');
  if(!dd)return;
  Array.from(dd.children).forEach(function(el,i){el.style.background=i===idx?'#ebf8ff':'';});
  dd._cursor=idx;
}

function ordItemKeyNav(e){
  const dd=document.getElementById('no_dropdown');
  if(!dd||dd.style.display==='none')return;
  const matches=dd._matches||[];
  let cursor=dd._cursor||0;
  if(e.key==='ArrowDown'){e.preventDefault();cursor=Math.min(cursor+1,matches.length-1);ordHover(cursor);}
  else if(e.key==='ArrowUp'){e.preventDefault();cursor=Math.max(cursor-1,0);ordHover(cursor);}
  else if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();if(matches[cursor])ordSelectItem(matches[cursor].id);}
  else if(e.key==='Escape'){dd.style.display='none';}
  dd._cursor=cursor;
}

async function deleteOrderLine(oiid,itemId,oid,qty){
  if(!confirm('Remove this item from order?'))return;
  // Unbook qty
  const {data:itm}=await SB.from('items').select('booked_qty').eq('id',itemId).single();
  if(itm)await SB.from('items').update({booked_qty:Math.max(0,(itm.booked_qty||0)-qty)}).eq('id',itemId);
  await SB.from('order_items').delete().eq('id',oiid);
  // Recalc order total
  const {data:remaining}=await SB.from('order_items').select('qty,price').eq('order_id',oid);
  const newTotal=(remaining||[]).reduce((s,i)=>s+i.qty*i.price,0);
  if(!remaining||!remaining.length){
    await SB.from('orders').update({status:'cancelled',total:0}).eq('id',oid);
    closeM();alert('No items left — order cancelled.');pgOrders();return;
  }
  await SB.from('orders').update({total:newTotal}).eq('id',oid);
  closeM();showOrdDetail(oid);
}

async function addOrderLine(oid){
  const itemId=document.getElementById('oadd_item').value;
  const qty=parseInt(document.getElementById('oadd_qty').value)||1;
  const price=parseFloat(document.getElementById('oadd_price').value)||0;
  if(!itemId){alert('Select an item');return;}
  // Check stock
  const {data:itm}=await SB.from('items').select('qty,booked_qty').eq('id',itemId).single();
  const avail=Math.max(0,(itm?.qty||0)-(itm?.booked_qty||0));
  if(qty>avail){alert(`Only ${avail} available for this item!`);return;}
  await SB.from('order_items').insert({order_id:oid,item_id:itemId,qty,price,status:'pending',picked:0});
  await SB.from('items').update({booked_qty:(itm?.booked_qty||0)+qty}).eq('id',itemId);
  // Recalc total
  const {data:allOI}=await SB.from('order_items').select('qty,price').eq('order_id',oid);
  const newTotal=(allOI||[]).reduce((s,i)=>s+i.qty*i.price,0);
  await SB.from('orders').update({total:newTotal}).eq('id',oid);
  closeM();showOrdDetail(oid);
}

async function saveEditOrder(oid){
  const {data:oi}=await SB.from('order_items').select('id,qty,item_id').eq('order_id',oid);
  for(const i of (oi||[])){
    const newQty=parseInt(document.getElementById('oedit_qty_'+i.id)?.value)||i.qty;
    if(newQty!==i.qty&&newQty>0){
      const diff=newQty-i.qty;
      // Update booked qty
      const {data:itm}=await SB.from('items').select('booked_qty').eq('id',i.item_id).single();
      if(itm)await SB.from('items').update({booked_qty:Math.max(0,(itm.booked_qty||0)+diff)}).eq('id',i.item_id);
      await SB.from('order_items').update({qty:newQty}).eq('id',i.id);
    }
  }
  // Recalc total
  const {data:allOI}=await SB.from('order_items').select('qty,price').eq('order_id',oid);
  const newTotal=(allOI||[]).reduce((s,i)=>s+i.qty*i.price,0);
  await SB.from('orders').update({total:newTotal}).eq('id',oid);
  closeM();alert('✅ Order updated!');pgOrders();
}

function calcConfirm(oid,iid,ordered){
  const s=Math.max(0,parseInt(document.getElementById('s_'+oid+'_'+iid).value)||0);
  const d=Math.max(0,parseInt(document.getElementById('d_'+oid+'_'+iid).value)||0);
  const conf=Math.max(0,ordered-s-d);
  document.getElementById('c_'+oid+'_'+iid).value=conf;
  if(s+d>ordered){
    document.getElementById('s_'+oid+'_'+iid).value=ordered-d>0?ordered-d:0;
    document.getElementById('c_'+oid+'_'+iid).value=0;
  }
}

async function confPick(oid,oiid,itemId,ordered){
  const s=Math.max(0,parseInt(document.getElementById('s_'+oid+'_'+oiid).value)||0);
  const d=Math.max(0,parseInt(document.getElementById('d_'+oid+'_'+oiid).value)||0);
  const c=Math.max(0,ordered-s-d);
  if(s+d>ordered){alert('Short + Damaged cannot exceed ordered qty ('+ordered+')');return;}
  await SB.from('order_items').update({picked:c,short_qty:s,damaged_qty:d,status:'picked'}).eq('id',oiid);
  if(s>0||d>0){
    await SB.from('short_damaged').insert({order_id:oid,item_id:itemId,ordered_qty:ordered,confirmed_qty:c,short_qty:s,damaged_qty:d,date:TD()});
  }
  const {data:rem}=await SB.from('order_items').select('id').eq('order_id',oid).eq('status','picking');
  if(!rem||!rem.length){
    const {data:allOI}=await SB.from('order_items').select('*').eq('order_id',oid);
    const newTotal=(allOI||[]).reduce(function(s,i){return s+i.picked*i.price;},0);
    await SB.from('orders').update({status:'picked',total:newTotal}).eq('id',oid);
  }
  pgPicking();
}

async function cancelDN(dnid,oid){
  // Check no invoice
  const {data:inv}=await SB.from('invoices').select('id').eq('order_id',oid);
  if((inv||[]).length>0){
    alert('⚠ Cannot cancel DN!\n\nInvoice already created for this order.');
    return;
  }
  if(!confirm('Cancel Delivery Note '+dnid+'?\n\nOrder '+oid+' will go back to "picked" status so you can create a new DN or cancel the order.'))return;
  await SB.from('delivery_notes').update({status:'cancelled'}).eq('id',dnid);
  await SB.from('orders').update({status:'picked'}).eq('id',oid);
  alert('✅ Delivery Note cancelled. Order is back to Picked status.');
  pgDN();
}

  alert('✅ Delivery Note '+dnId+' created!');

async function makeInv(dnid,oid,custId){
  const {data:cust}=await SB.from('customers').select('*').eq('id',custId).single();
  if(cust?.type==='Credit'&&cust.balance>=cust.credit_limit){alert('⚠ Invoice blocked! Credit limit exceeded.\n'+AED(cust.balance)+' / '+AED(cust.credit_limit));return;}

  // Get order items — use PICKED qty only (excludes damaged/short)
  const {data:oi}=await SB.from('order_items').select('*').eq('order_id',oid);
  const confirmedItems=(oi||[]).filter(i=>i.picked>0);
  // Invoice total = confirmed picked qty × price (damaged NOT billed)
  const tot=confirmedItems.reduce((s,i)=>s+i.picked*i.price,0);
  const damagedAmt=(oi||[]).reduce((s,i)=>s+i.damaged_qty*i.price,0);

  if(tot<=0){alert('No confirmed items to invoice!');return;}

  const invId='INV'+Date.now().toString(36).toUpperCase().slice(-6);
  await SB.from('invoices').insert({id:invId,order_id:oid,delivery_note_id:dnid,customer_id:custId,date:TD(),total:tot,status:'unpaid'});
  await SB.from('delivery_notes').update({status:'invoiced'}).eq('id',dnid);
  if(cust?.type==='Credit')await SB.from('customers').update({balance:(cust.balance||0)+tot}).eq('id',custId);

  // Deduct only confirmed (picked) qty from inventory
  for(const item of (oi||[])){
    const {data:itm}=await SB.from('items').select('qty,booked_qty').eq('id',item.item_id).single();
    if(itm)await SB.from('items').update({
      qty:Math.max(0,itm.qty-item.picked),
      booked_qty:Math.max(0,itm.booked_qty-item.qty)
    }).eq('id',item.item_id);
  }
  await SB.from('orders').update({status:'delivered',total:tot}).eq('id',oid);

  const msg=damagedAmt>0
    ?`✅ Invoice ${invId} created!\nConfirmed Items: ${AED(tot)}\nDamaged (not billed): ${AED(damagedAmt)}`
    :`✅ Invoice ${invId} — ${AED(tot)}`;
  alert(msg);
  pgInv2();
}
async function mrkPaid(invId,custId,tot){
  await SB.from('invoices').update({status:'paid'}).eq('id',invId);
  const {data:c}=await SB.from('customers').select('*').eq('id',custId).single();
  if(c?.type==='Credit')await SB.from('customers').update({balance:Math.max(0,(c.balance||0)-tot)}).eq('id',custId);
  pgInv2();
}

function toggleBO(boid,itemId,itemName,pendingQty,cost){
  const idx=window._availBOs.findIndex(b=>b.id===boid);
  const chk=document.getElementById('bo_chk_'+idx);
  if(!chk)return;
  chk.checked=!chk.checked;
  const row=document.getElementById('bo_row_'+idx);
  if(row)row.style.background=chk.checked?'#ebf8ff':'';
  if(chk.checked){
    window._selectedBOs.push({bo_id:boid,item_id:itemId,name:itemName,pending_qty:pendingQty,qty:pendingQty,cost:cost||0});
    poLns.push({item_id:itemId,name:itemName,part_no:'',qty:pendingQty,cost:cost||0,bo_id:boid,max_qty:pendingQty});
  } else {
    window._selectedBOs=window._selectedBOs.filter(b=>b.bo_id!==boid);

  if(info)info.innerHTML=window._selectedBOs.length
    ?'<b>'+window._selectedBOs.length+' back order(s) selected:</b> '+window._selectedBOs.map(b=>b.name+' (Qty:'+b.qty+')').join(', ')

async function savePO(poType){
  poType=poType||'stock';
  if(!poLns.length){alert('Add items first');return;}
  const supId=document.getElementById('po_sup').value;
  if(!supId){alert('Select supplier');return;}
  const {data:sup}=await SB.from('suppliers').select('name').eq('id',supId).single();
  const id='PO'+Date.now().toString(36).toUpperCase().slice(-6);
  const tot=poLns.reduce((s,l)=>s+l.qty*l.cost,0);
  const {error}=await SB.from('purchase_orders').insert({
    id,supplier_id:supId,supplier:sup?.name||supId,
    date:document.getElementById('po_d').value,
    expected_date:document.getElementById('po_exp').value||null,
    status:'pending',total:tot,po_type:poType,
    notes:document.getElementById('po_notes').value
  });
  if(error){alert(error.message);return;}
  await SB.from('po_items').insert(poLns.map(l=>({po_id:id,item_id:l.item_id,qty:l.qty,cost:l.cost})));
  if(poType==='customer_order'&&(window._selectedBOs||[]).length){
    await SB.from('po_back_order_links').insert(window._selectedBOs.map(bo=>({po_id:id,back_order_id:bo.bo_id})));
  }
  closeM();
  alert('✅ PO '+id+' created!\nType: '+(poType==='customer_order'?'Customer Order':'Stock Order')+'\nTotal: '+AED(tot));
  pgPO();
}

async function saveEditPO(poid){
  const {data:pi}=await SB.from('po_items').select('id').eq('po_id',poid);
  for(const i of (pi||[])){
    const qty=parseInt(document.getElementById('epo_qty_'+i.id)?.value)||1;
    const cost=parseFloat(document.getElementById('epo_cost_'+i.id)?.value)||0;
    await SB.from('po_items').update({qty,cost}).eq('id',i.id);
  }
  const {data:allPi}=await SB.from('po_items').select('qty,cost').eq('po_id',poid);
  await SB.from('purchase_orders').update({
    total:(allPi||[]).reduce(function(s,i){return s+i.qty*i.cost;},0),
    expected_date:document.getElementById('epo_exp').value||null,
    notes:document.getElementById('epo_notes').value
  }).eq('id',poid);

async function confirmReceiving(poid,count){
  const invNo=document.getElementById('recv_inv').value.trim();
  if(!invNo){alert('Enter supplier invoice number');return;}
  const recvDate=document.getElementById('recv_date').value;
  const {data:pi}=await SB.from('po_items').select('*').eq('po_id',poid);
  let allOk=true;
  const adjId='ADJ'+Date.now().toString(36).toUpperCase().slice(-6);
  await SB.from('inventory_adjustments').insert({id:adjId,po_id:poid,type:'po_receive',date:recvDate,notes:'Invoice: '+invNo,status:'confirmed'});
  for(let idx=0;idx<count;idx++){
    const item=pi[idx];if(!item)continue;
    const invQty=parseInt(document.getElementById('ri_inv_'+idx).value)||0;
    const recQty=parseInt(document.getElementById('ri_rec_'+idx).value)||0;
    const damQty=parseInt(document.getElementById('ri_dam_'+idx).value)||0;
    const shtQty=parseInt(document.getElementById('ri_sht_'+idx).value)||0;
    const newCost=parseFloat(document.getElementById('ri_cost_'+idx).value)||item.cost;
    await SB.from('adjustment_items').insert({adjustment_id:adjId,item_id:item.item_id,expected_qty:item.qty,received_qty:recQty,damaged_qty:damQty,short_qty:shtQty,unit_cost:newCost});
    if(recQty>0){
      const {data:itm}=await SB.from('items').select('qty,cost').eq('id',item.item_id).single();
      if(itm){const nq=itm.qty+recQty,ac=(itm.qty*itm.cost+recQty*newCost)/nq;await SB.from('items').update({qty:nq,cost:Math.round(ac*100)/100,updated_at:new Date().toISOString()}).eq('id',item.item_id);}
    }
    if(shtQty>0||damQty>0)allOk=false;
  }
  await SB.from('purchase_orders').update({status:'received',notes:'Invoice: '+invNo}).eq('id',poid);
  closeM();
  if(!allOk){if(confirm('⚠ Short/Damaged items found! Create Claim Form now?'))showClaimForm(poid);}
  else alert('✅ Receiving done! Stock & average cost updated.');
  pgPO();
}

function calcClaim(idx,unitCost){
  const invQty=parseInt(document.getElementById('cl_iq_'+idx).value)||0;
  let sq=parseInt(document.getElementById('cl_sq_'+idx).value)||0;
  let dq=parseInt(document.getElementById('cl_dq_'+idx).value)||0;

  // Validation — short + damaged cannot exceed invoice qty
  if(sq+dq>invQty){
    const field=document.activeElement?.id;
    if(field==='cl_sq_'+idx){
      sq=Math.max(0,invQty-dq);
      document.getElementById('cl_sq_'+idx).value=sq;
      document.getElementById('cl_sq_'+idx).style.borderColor='#e53e3e';
      setTimeout(()=>document.getElementById('cl_sq_'+idx).style.borderColor='',2000);
    } else {
      dq=Math.max(0,invQty-sq);
      document.getElementById('cl_dq_'+idx).value=dq;
      document.getElementById('cl_dq_'+idx).style.borderColor='#e53e3e';
      setTimeout(()=>document.getElementById('cl_dq_'+idx).style.borderColor='',2000);
    }
    // Show inline error
    let errEl=document.getElementById('cl_err_'+idx);
    if(!errEl){
      errEl=document.createElement('div');
      errEl.id='cl_err_'+idx;
      errEl.style.cssText='color:#e53e3e;font-size:11px;font-weight:700;margin-top:2px';
      document.getElementById('cl_sq_'+idx).parentElement.parentElement.appendChild(errEl);
    }
    errEl.textContent='⚠ Short + Damaged cannot exceed Invoice Qty ('+invQty+')';
    setTimeout(()=>{if(errEl)errEl.textContent='';},3000);
  } else {
    const errEl=document.getElementById('cl_err_'+idx);
    if(errEl)errEl.textContent='';
  }

  const recvOK=Math.max(0,invQty-sq-dq);
  // Update received ok display if element exists
  const recvEl=document.getElementById('cl_rec_'+idx);
  if(recvEl)recvEl.textContent=recvOK;

  const claimAmt=(sq+dq)*unitCost;
  document.getElementById('cl_amt_'+idx).value=claimAmt.toFixed(2);

  // Update total
  let tot=0;
  (window._claimPOItems||[]).forEach((_,i)=>{tot+=parseFloat(document.getElementById('cl_amt_'+i)?.value||0);});
  document.getElementById('cl_total').textContent=AED(tot);
}

async function saveAndPrintClaim(poid,supName,supId){
  const invNo=document.getElementById('cl_inv').value.trim();
  if(!invNo){alert('Enter invoice number');return;}

  // Final validation before saving
  const pi=window._claimPOItems||[];
  let validationError='';
  pi.forEach((item,idx)=>{
    const invQty=parseInt(document.getElementById('cl_iq_'+idx).value)||0;
    const sq=parseInt(document.getElementById('cl_sq_'+idx).value)||0;
    const dq=parseInt(document.getElementById('cl_dq_'+idx).value)||0;
    if(sq+dq>invQty){
      validationError+=`\n• ${item.items?.name||item.item_id}: Short(${sq}) + Damaged(${dq}) = ${sq+dq} exceeds Invoice Qty(${invQty})`;
    }
    if(sq<0||dq<0){
      validationError+=`\n• ${item.items?.name||item.item_id}: Negative quantities not allowed`;
    }
  });
  if(validationError){
    alert('❌ Cannot save claim — fix these errors:'+validationError);return;
  }

  const clId='CLM'+Date.now().toString(36).toUpperCase().slice(-6);
  const tot=pi.reduce((a,_,idx)=>a+parseFloat(document.getElementById('cl_amt_'+idx)?.value||0),0);

  if(tot<=0){alert('⚠ No claim amount! Enter short or damaged quantities first.');return;}

  await SB.from('claim_forms').insert({id:clId,po_id:poid,supplier_id:supId||null,invoice_no:invNo,date:document.getElementById('cl_date').value,status:'draft',total_claim_amount:tot,notes:document.getElementById('cl_notes').value});

  const claimItems=pi.map((i,idx)=>{
    const invQty=parseInt(document.getElementById('cl_iq_'+idx).value)||0;
    const sq=parseInt(document.getElementById('cl_sq_'+idx).value)||0;
    const dq=parseInt(document.getElementById('cl_dq_'+idx).value)||0;
    const recvOK=Math.max(0,invQty-sq-dq);
    return {
      claim_id:clId,item_id:i.item_id,
      part_no:i.items?.part_no||'',
      description:i.items?.name||i.item_id,
      invoice_qty:invQty,
      received_qty:recvOK,
      short_qty:sq,damaged_qty:dq,
      unit_cost:i.cost,
      claim_amount:parseFloat(document.getElementById('cl_amt_'+idx).value)||0
    };
  }).filter(x=>x.short_qty>0||x.damaged_qty>0);

  if(claimItems.length)await SB.from('claim_items').insert(claimItems);
  const notes=document.getElementById('cl_notes').value;
  const date=document.getElementById('cl_date').value;
  closeM();
  printClaimForm(clId,poid,supName,invNo,date,claimItems,tot,notes);
}

    const {data:itm}=await SB.from('items').select('qty,cost').eq('id',bo.item_id).single();
    if(itm){
      await SB.from('items').update({qty:itm.qty+qty,updated_at:new Date().toISOString()}).eq('id',bo.item_id);
    }
    // Update back order pending qty
    const newPending=bo.pending_qty-qty;
    const newStatus=newPending<=0?'fulfilled':'approved';
    await SB.from('back_orders').update({pending_qty:Math.max(0,newPending),fulfilled_qty:(bo.fulfilled_qty||0)+qty,status:newStatus}).eq('id',bo.id);

    // Send notification
    if(notifyStaffId){
      await SB.from('receiving_notifications').insert({
        po_id:null,back_order_id:bo.id,item_id:bo.item_id,
        received_qty:qty,notified_to:notifyStaffId,date,
        notes:'Against BO: '+bo.id+(notes?' — '+notes:''),read:false
      });
    }
  }
  closeM();
  alert('✅ Customer order receiving confirmed!\n'+selected.length+' back order(s) updated.\n'+(notifyStaffId?'Staff notified via Inventory Adjustments.':''));
  pgInvAdj();
}

function showAdjInfo(){const sel=document.getElementById('adj_item'),opt=sel.selectedOptions[0];document.getElementById('adj_item_info').innerHTML='Current Stock: <b>'+opt.dataset.qty+'</b> | Last Cost: <b>'+AED(opt.dataset.cost)+'</b>';document.getElementById('adj_cost').value=opt.dataset.cost;}
async function saveManualAdj(){
  const itemId=document.getElementById('adj_item').value,qty=parseInt(document.getElementById('adj_qty').value),cost=parseFloat(document.getElementById('adj_cost').value)||0;
  if(isNaN(qty)||qty===0){alert('Enter qty (+/-)');return;}
  const {data:itm}=await SB.from('items').select('qty,cost').eq('id',itemId).single();
  const nq=Math.max(0,itm.qty+qty);
  let nc=itm.cost;
  if(qty>0&&cost>0){nc=Math.round(((itm.qty*itm.cost+qty*cost)/nq)*100)/100;}
  await SB.from('items').update({qty:nq,cost:nc,updated_at:new Date().toISOString()}).eq('id',itemId);
  const adjId='ADJ'+Date.now().toString(36).toUpperCase().slice(-6);
  await SB.from('inventory_adjustments').insert({id:adjId,type:document.getElementById('adj_type').value,date:document.getElementById('adj_date').value,notes:document.getElementById('adj_notes').value,status:'confirmed'});
  closeM();alert('✅ Done! New Stock: '+nq);pgInvAdj();
}

async function pgBackOrders(){
  try{
    const [{data:bos},{data:items},{data:custs},{data:orders}]=await Promise.all([
      SB.from('back_orders').select('*,items(name,part_no,our_part_no)').order('created_at',{ascending:false}),
      SB.from('items').select('id,name,qty,booked_qty'),
      SB.from('customers').select('id,name'),
      SB.from('orders').select('id,customer_id,order_type')
    ]);

    const pending=(bos||[]).filter(b=>b.status==='pending');
    const approved=(bos||[]).filter(b=>b.status==='approved');
    const fulfilled=(bos||[]).filter(b=>b.status==='fulfilled');

    const canApprove=['manager','owner','store_supervisor'].includes(CS.role);
    const isOrdering=CS.role==='ordering';

    const otBadge=(t)=>t==='EO'?'<span class="badge badge-danger">🔴 EO</span>':t==='SE'?'<span class="badge badge-warning">🟡 SE</span>':'<span class="badge badge-info">🔵 SO</span>';

    const renderBOTable=(list,showApprove,showSentToOrdering)=>{
      if(!list.length) return '<div class="empty-state" style="padding:20px">No records</div>';
      return `<div class="tbl-wrap"><table>
        <thead><tr><th>BO ID</th><th>Order</th><th>Customer</th><th>Item</th><th>Pending Qty</th><th>Type</th><th>ETA</th><th>Notes</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>${list.map(bo=>{
          const ord=orders?.find(o=>o.id===bo.order_id);
          const cust=custs?.find(c=>c.id===ord?.customer_id);
          const itm=items?.find(i=>i.id===bo.item_id);
          const avail=Math.max(0,(itm?.qty||0)-(itm?.booked_qty||0));
          return `<tr>
            <td><b style="color:#185FA5">${bo.id}</b></td>
            <td style="font-size:12px">${bo.order_id}</td>
            <td style="font-size:12px">${cust?.name||'—'}</td>
            <td><b>${bo.items?.name||bo.item_id}</b><br><span style="font-size:11px;color:#718096">${bo.items?.part_no||''}</span></td>
            <td><b class="text-danger">${bo.pending_qty}</b><br><span style="font-size:11px;color:#718096">Avail now: ${avail}</span></td>
            <td>${otBadge(bo.order_type||ord?.order_type||'SO')}</td>
            <td style="color:#d69e2e;font-size:12px">${bo.eta||'—'}</td>
            <td style="font-size:12px;color:#718096;max-width:120px">${bo.notes||'—'}</td>
            <td><span class="badge ${bo.status==='pending'?'badge-warning':bo.status==='approved'?'badge-info':'badge-success'}">${bo.status}</span></td>
            <td style="display:flex;gap:5px;flex-wrap:wrap">
              <button class="btn btn-sm" onclick="showEditBO('${bo.id}')">✏️ Edit</button>
              ${showApprove&&canApprove?`<button class="btn btn-sm btn-primary" onclick="approveBO('${bo.id}')">✅ Approve → Ordering</button>`:''}
              ${showSentToOrdering&&isOrdering?`<button class="btn btn-sm btn-success" onclick="fulfillBO('${bo.id}')">✅ Mark Fulfilled</button>`:''}
            </td>
          </tr>`;
        }).join('')}</tbody></table></div>`;
    };

    setHTML(`<div class="page-hdr"><div class="page-title">Back Orders</div></div>
    <div class="grid3" style="margin-bottom:14px">
      <div class="metric"><div class="metric-label">Pending Approval</div><div class="metric-value text-danger">${pending.length}</div></div>
      <div class="metric"><div class="metric-label">Sent to Ordering</div><div class="metric-value" style="color:#185FA5">${approved.length}</div></div>
      <div class="metric"><div class="metric-label">Fulfilled</div><div class="metric-value text-success">${fulfilled.length}</div></div>
    </div>

    ${pending.length?`
    <div class="card" style="border-color:#fc8181">
      <div class="card-title" style="color:#9b2c2c">⏳ PENDING APPROVAL (${pending.length})</div>
      ${canApprove?'<div class="alert alert-info" style="margin-bottom:10px">Review and approve to send to Ordering Department</div>':''}
      ${renderBOTable(pending,true,false)}
    </div>`:''}

    ${approved.length?`
    <div class="card" style="border-color:#90cdf4">
      <div class="card-title" style="color:#2c5282">📋 SENT TO ORDERING DEPT (${approved.length})</div>
      ${isOrdering?'<div class="alert alert-info" style="margin-bottom:10px">These back orders need to be purchased. Mark fulfilled after ordering.</div>':''}
      ${renderBOTable(approved,false,true)}
    </div>`:''}

    ${fulfilled.length?`
    <div class="card">
      <div class="card-title">✅ FULFILLED BACK ORDERS</div>
      ${renderBOTable(fulfilled,false,false)}
    </div>`:''}

    ${!pending.length&&!approved.length&&!fulfilled.length?'<div class="card"><div class="empty-state"><div style="font-size:32px">📋</div><p>No back orders yet</p></div></div>':''}`);
  }catch(e){
    setHTML(`<div class="alert alert-warning">Error: ${e.message}</div><button class="btn btn-primary" onclick="pgBackOrders()">🔄 Retry</button>`);
  }
}
